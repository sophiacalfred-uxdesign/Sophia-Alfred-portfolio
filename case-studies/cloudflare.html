<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cloudflare — Sophia Alfred</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    @font-face {
      font-family: 'Self Modern';
      src: url('../assets/fonts/Self_Modern_Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Light.otf') format('opentype'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Medium.otf') format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Semibold.otf') format('opentype'); font-weight: 600; font-style: normal; font-display: swap; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FCFDFE; color: #1C1C22; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(4,110,235,0.04); color: #046EEB; }
    ::-moz-selection { background: rgba(4,110,235,0.04); color: #046EEB; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #FCFDFE; }
    ::-webkit-scrollbar-thumb { background: #A8A8B3; border-radius: 3px; }

    @keyframes toastPop {
      0% { opacity: 0; transform: translateX(-50%) translateY(4px) scale(0.95); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-4px) scale(0.95); }
    }
    .copied-toast {
      position: absolute; top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: #1C1C22; color: #fff;
      font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 6px; white-space: nowrap;
      animation: toastPop 1.5s ease forwards;
      pointer-events: none;
    }

    .sidenav {
      position: sticky; top: 56px;
      width: 240px; min-width: 240px;
      height: calc(100vh - 56px);
      padding: 32px 24px 24px 36px;
      background: transparent;
      display: flex; flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0; align-self: flex-start;
    }
    .sidenav-top { display: flex; flex-direction: column; gap: 0; }
    .sidenav-heading {
      font-family: 'IBM Plex Mono', monospace; font-weight: 500;
      font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: #A8A8B3;
      margin-bottom: 16; padding-left: 16px;
    }
    .sidenav-link {
      font-family: 'Switzer', sans-serif; font-weight: 400;
      font-size: 14px; letter-spacing: 0.01em; line-height: 1.5;
      text-decoration: none;
      display: block; padding: 6px 0 6px 20px;
      color: #7A7A85; transition: color 0.15s ease;
    }
    .sidenav-link.active { color: #1C1C22; font-weight: 500; }
    .sidenav-link:hover { color: #1C1C22; }
    /* Nested sub-group: deeper indent; the rail SVG draws the inward bulge */
    .sidenav-sub-group { display: flex; flex-direction: column; }
    .sidenav-sub-group .sidenav-link.sub {
      padding-left: 28px;
      font-size: 13px;
    }
    .sidenav-sub-group .sidenav-link.sub.active { color: #1C1C22; font-weight: 500; }
    /* Two SVG rails stacked under the links: muted (full) + active (clipped segment) */
    .sidenav-rail { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
    .sidenav-rail.active {
      clip-path: polygon(0 0, 0 0, 0 0, 0 0);
      transition: clip-path 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidenav-link.home-link {
      font-family: 'IBM Plex Mono', monospace; font-weight: 400;
      font-size: 11px; letter-spacing: 0.06em;
      text-transform: uppercase; color: #6E6E78;
      border-left: none; padding-left: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .sidenav-link.home-link:hover { color: #1C1C22; }
    .sidenav-link svg { flex-shrink: 0; }

    .hero-tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: 'IBM Plex Mono', monospace; font-weight: 500;
      font-size: 11px; letter-spacing: 0.04em;
      padding: 5px 12px; border-radius: 100px;
      border: 1px solid rgba(28,28,34,0.12);
      color: #6E6E78; background: transparent;
      text-decoration: none; transition: all 0.15s ease;
    }
    .hero-tag:hover { color: #1C1C22; border-color: rgba(28,28,34,0.25); }
    .hero-tag-link { cursor: pointer; }
    .hero-tag-link:hover { transform: translate(2px, -2px); }
    .hero-tag-link svg { transition: transform 0.15s ease; }

    .cta-link {
      font-family: 'Switzer', sans-serif;
      font-size: 14px;
      line-height: 24px;
      color: #5A5A65;
      background: linear-gradient(to right, rgba(4, 110, 235, 0.08) 100%, transparent 0);
      background-size: 0% 100%;
      background-repeat: no-repeat;
      background-position: left;
      transition: background-size 0.6s ease, color 0.6s ease;
      border-radius: 2px;
    }
    .cta-link:hover {
      background-size: 100% 100%;
      color: #046EEB;
    }
    .cta-link svg { transition: transform 0.15s ease; }
    .cta-link:hover svg { transform: translate(2px, -2px); }

    .cta-links { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .cta-dot { color: #5A5A65; font-size: 14px; }

    @media (max-width: 768px) {
      .cta-links { flex-direction: column; align-items: flex-start; gap: 6px; }
      .cta-dot { display: none; }
    }

    .content-pad { padding: 0 clamp(40px, 5vw, 80px); max-width: 850px; }
    .content-wide { padding: 0 clamp(40px, 5vw, 80px); max-width: 1080px; }

    .problem-card {
      padding: 10px 0;
      border: none;
      cursor: pointer;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .problem-number {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Switzer', sans-serif; font-weight: 600;
      font-size: 12px; flex-shrink: 0; margin-top: 1px;
      background: transparent; color: #A8A8B3;
      border: 1px solid rgba(28,28,34,0.12);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .problem-card.active .problem-number {
      background: #1C1C22; color: #fff; border-color: #1C1C22;
    }
    .problem-card-title {
      font-family: 'Switzer', sans-serif; font-weight: 600;
      font-size: 15px; color: #6E6E78; margin-bottom: 4px; line-height: 1.4;
      transition: color 0.2s ease;
    }
    .problem-card.active .problem-card-title {
      color: #1C1C22;
    }
    .problem-card-desc {
      font-family: 'Switzer', sans-serif; font-weight: 400;
      font-size: 13px; color: #6E6E78; line-height: 1.5;
    }
    .problem-image-wrap {
      position: relative; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(28,28,34,0.08); margin-bottom: 8px;
    }
    .problem-image-wrap img {
      display: block; width: 100%; height: auto;
    }
    .problem-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    /* Sliding spotlight: the box-shadow darkens everything outside the rect,
       and the rect's position/size transitions smoothly between problems. */
    .problem-spotlight {
      position: absolute;
      border-radius: 6px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
      pointer-events: none;
      transition: top 0.55s cubic-bezier(0.4,0,0.2,1),
                  left 0.55s cubic-bezier(0.4,0,0.2,1),
                  width 0.55s cubic-bezier(0.4,0,0.2,1),
                  height 0.55s cubic-bezier(0.4,0,0.2,1),
                  opacity 0.35s ease;
    }
    .problem-highlight {
      position: absolute;
      box-shadow: 0 0 0 3px rgba(28,28,34,0.15);
      border-radius: 6px;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .problem-hint {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px;
      font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      color: #A8A8B3; text-align: right; margin-top: 0px;
    }
    .expand-btn {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(28,28,34,0.7); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.2s ease;
      z-index: 2;
    }
    .problem-image-wrap:hover .expand-btn { opacity: 1; }
    .cv-wrap:hover .expand-btn { opacity: 1; }
    .cv-stage:hover .cv-controls { opacity: 1 !important; }
    .expand-btn:hover { background: rgba(28,28,34,0.9); }
    @media (max-width: 720px) {
      .insight-row { grid-template-columns: 1fr !important; gap: 12px !important; }
    }
    /* Scroll-into-view word highlight (matches the home-page blurb effect) */
    .scroll-highlight {
      background: linear-gradient(to right, rgba(4, 110, 235, 0.10) 100%, transparent 0);
      background-size: 0% 100%;
      background-repeat: no-repeat;
      background-position: left;
      transition: background-size 0.6s ease, color 0.6s ease;
      border-radius: 2px;
      font-weight: 600;
    }
    .highlight-active .scroll-highlight {
      background-size: 100% 100%;
      color: #046EEB;
    }
    .image-modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
      animation: modalFadeIn 0.2s ease;
    }
    .modal-inner {
      display: flex; gap: 12px; align-items: flex-start;
      max-width: calc(100vw - 120px); cursor: default;
    }
    .image-modal-panel {
      background: #fff; border-radius: 12px;
      max-width: 1100px; width: 100%;
      max-height: calc(100vh - 12px);
      overflow-y: auto;
      padding: 24px 32px 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.2);
    }
    .image-modal-panel::-webkit-scrollbar { width: 8px; }
    .image-modal-panel::-webkit-scrollbar-track { background: transparent; margin: 8px 0; }
    .image-modal-panel::-webkit-scrollbar-thumb {
      background: #A8A8B3; border-radius: 4px;
      border-right: 2px solid #fff;
    }
    .image-modal-panel img {
      max-width: 100%; height: auto;
      border-radius: 8px; display: block;
    }
    .modal-close-btn {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      background: rgba(255,255,255,0.9); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .modal-close-btn:hover { background: #fff; }
    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .sidenav { display: none; }
    }
  </style>

<script type="text/babel">

/* ──────────────────────────────────────────────────────────────────────────
   RADAR_LIVE — flip to `true` once the redesigned Radar has shipped.
   false (pre-launch): hero shows a non-linked "Web Design" tag, no live-site /
     blog links, and the Impact row reads "scheduled to go live".
   true (post-launch): hero shows the linked "Shipped!" tag + live-site and blog
     links, and the Impact row reads "The updated site is now live!" linked to
     radar.cloudflare.com.
   ────────────────────────────────────────────────────────────────────────── */
const RADAR_LIVE = false;
const RADAR_URL = 'https://radar.cloudflare.com';
const RADAR_BLOG_URL = 'https://blog.cloudflare.com/radar-redesign-birthday-week-2026';

/* useInView — attach the returned ref to an element; `inView` flips true the
   first time that element scrolls into the viewport. Used to delay looping
   demo animations until the user actually reaches the section. */
function useInView({ rootMargin = '0px 0px -20% 0px', threshold = 0.25, once = true } = {}) {
  const ref = React.useRef(null);
  const [inView, setInView] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        if (once) obs.disconnect();
      } else if (!once) {
        setInView(false);
      }
    }, { rootMargin, threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function EWNav({ activePage }) {
  const [pastHero, setPastHero] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  React.useEffect(() => {
    const onScroll = () => setPastHero(window.scrollY > 0);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const handleCopyEmail = () => {
    try { navigator.clipboard.writeText('sophiacalfred@gmail.com'); } catch {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  return (
    <nav style={{
      width: '100%', height: 56,
      background: pastHero ? 'rgba(252,253,254,0.9)' : 'rgba(252,253,254,0.2)',
      backdropFilter: pastHero ? 'blur(12px)' : 'none',
      WebkitBackdropFilter: pastHero ? 'blur(12px)' : 'none',
      transition: 'background 0.3s ease, backdrop-filter 0.3s ease, -webkit-backdrop-filter 0.3s ease',
      borderBottom: '1px solid rgba(28,28,34,0.07)',
      display: 'flex', alignItems: 'center',
      justifyContent: 'space-between', padding: '0 24px',
      position: 'sticky', top: 0, zIndex: 100, boxSizing: 'border-box'
    }}>
      <a href="../index.html" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
        <img src="../assets/sophia-logo.png" alt="sophia alfred" style={{ height: 28, display: 'block' }} />
      </a>
      <div style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
        {[
          ['work',   'Work', '../index.html#case-studies'],
          ['about',  'About',        '../about.html'],
          ['resume', 'Resume',       '../assets/sophia-resume.pdf'],
        ].map(([id, label, href]) =>
          <a key={id} href={href}
            target={id === 'resume' ? '_blank' : undefined}
            rel={id === 'resume' ? 'noopener noreferrer' : undefined}
            style={{
              fontFamily: 'Switzer, sans-serif', fontWeight: 400, fontSize: 14,
              letterSpacing: '0.01em',
              textDecoration: activePage === id ? 'underline' : 'none',
              textUnderlineOffset: '4px',
              color: activePage === id ? '#1C1C22' : '#67676F', transition: 'color 0.2s',
            }}
            onMouseEnter={e => { e.target.style.color = '#1C1C22'; e.target.style.textDecoration = 'underline'; }}
            onMouseLeave={e => { e.target.style.color = activePage === id ? '#1C1C22' : '#67676F'; e.target.style.textDecoration = activePage === id ? 'underline' : 'none'; }}>
            {label}
          </a>
        )}
        <div style={{ width: 1, height: 16, background: 'rgba(28,28,34,0.12)' }} />
        <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
          <button onClick={handleCopyEmail} style={{
            background: 'none', border: 'none', padding: 0, cursor: 'pointer',
            color: '#67676F', transition: 'color 0.15s ease', display: 'flex',

function SideNav({ view = 'full' }) {
  const links = view === 'tldr' ? TLDR_NAV_LINKS : NAV_LINKS;
  const [active, setActive] = React.useState(links[0].id);
  const listRef = React.useRef(null);
  const linkRefs = React.useRef({});
  const [railPath, setRailPath] = React.useState('');
  const [railSize, setRailSize] = React.useState({ w: 0, h: 0 });
  const [activeClip, setActiveClip] = React.useState('polygon(0 0, 0 0, 0 0, 0 0)');

  // Flat ordered list of { id, depth } matching render order.
  const items = React.useMemo(() => {
    const out = [];
    links.forEach(({ id, children }) => {
      out.push({ id, depth: 2 });
      (children || []).forEach(c => out.push({ id: c.id, depth: 3 }));
    });
    return out;
  }, [links]);

  React.useEffect(() => {
    const ids = items.map(it => it.id);
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { rootMargin: '-56px 0px -70% 0px', threshold: 0 });

    ids.forEach((id) => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [view, items]);

  // Paint a single continuous rail: one straight segment per link at its own
  // depth-x, joined by cubic connectors. When x jumps (h2->h3) the curve bulges
  // inward. The active rail is the same path, clipped to the active segment so
  // it slides like a train-cart.
  React.useLayoutEffect(() => {
    const lineX = (depth) => (depth <= 2 ? 8 : 16);
    const compute = () => {
      const list = listRef.current;
      if (!list) { setRailPath(''); return; }
      const L = list.getBoundingClientRect();
      let d = '', w = 0, h = 0, prev = null;
      const positions = {};
      items.forEach(({ id, depth }) => {
        const el = linkRefs.current[id];
        if (!el) return;
        const x = lineX(depth) + 0.5;
        const cs = getComputedStyle(el);
        const top = (el.getBoundingClientRect().top - L.top) + parseFloat(cs.paddingTop);
        const bottom = (el.getBoundingClientRect().top - L.top) + el.clientHeight - parseFloat(cs.paddingBottom);
        w = Math.max(x + 8, w);
        h = Math.max(h, bottom);
        if (!prev) {
          d += ` M${x} ${top} L${x} ${bottom}`;
        } else {
          d += ` C ${prev.x} ${top - 4} ${x} ${prev.bottom + 4} ${x} ${top} L${x} ${bottom}`;
        }
        positions[id] = { top, bottom, x };
        prev = { x, bottom };
      });
      setRailPath(d);
      setRailSize({ w, h });
      const p = positions[active];
      if (p) {
        setActiveClip(`polygon(0 ${p.top}px, 100% ${p.top}px, 100% ${p.bottom}px, 0 ${p.bottom}px)`);
      } else {
        setActiveClip('polygon(0 0, 0 0, 0 0, 0 0)');
      }
    };
    compute();
    window.addEventListener('resize', compute);
    const t = setTimeout(compute, 50); // after fonts/layout settle
    return () => { window.removeEventListener('resize', compute); clearTimeout(t); };
  }, [view, active, items]);

  return (
    <aside className="sidenav">
      <div className="sidenav-top">
        <a href="../index.html" className="sidenav-link home-link" style={{ marginBottom: 16 }}>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
          Home
        </a>

        <div ref={listRef} style={{ position: 'relative' }}>
          {/* muted full rail */}
          <svg className="sidenav-rail" width={railSize.w} height={railSize.h}
            viewBox={`0 0 ${railSize.w} ${railSize.h}`} aria-hidden="true">
            <path d={railPath} fill="none" stroke="rgba(0,0,0,0.14)" strokeWidth="1" />
          </svg>
          {/* active rail, clipped to current segment (slides between items) */}
          <svg className="sidenav-rail active" width={railSize.w} height={railSize.h}
            viewBox={`0 0 ${railSize.w} ${railSize.h}`} aria-hidden="true"
            style={{ clipPath: activeClip }}>
            <path d={railPath} fill="none" stroke="#1C1C22" strokeWidth="1.5" />
          </svg>
          {links.map(({ id, label, children }) => {
            const childActive = children && children.some(c => c.id === active);
            return (
              <React.Fragment key={id}>
                <a href={`#${id}`} ref={el => (linkRefs.current[id] = el)}
                  className={`sidenav-link${(active === id || childActive) ? ' active' : ''}`}>
                  {label}
                </a>
                {children && (
                  <div className="sidenav-sub-group">
                    {children.map(c => (
                      <a key={c.id} href={`#${c.id}`} ref={el => (linkRefs.current[c.id] = el)}
                        className={`sidenav-link sub${active === c.id ? ' active' : ''}`}>
                        {c.label}
                      </a>
                    ))}
                  </div>
                )}
              </React.Fragment>
            );
          })}
        </div>
      </div>
      <a href="#overview" className="sidenav-link home-link"
        onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
        <ArrowUp /> Back to top
      </a>
    </aside>
  );
}

/* ── DotGrid with bulge ── */
function DotGrid({ width, height, mouseX, mouseY }) {
  const canvasRef = React.useRef(null);
  const GAP = 16;
  const BULGE_RADIUS = 160;
  const BULGE_STRENGTH = 24;

  const displace = React.useCallback((x, y) => {
    if (mouseX === null || mouseY === null) return { x, y };
    const dx = x - mouseX;
    const dy = y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < BULGE_RADIUS && dist > 0) {
      const t = 1 - dist / BULGE_RADIUS;
      const ease = t * t;
      const push = ease * BULGE_STRENGTH;
      return { x: x + (dx / dist) * push, y: y + (dy / dist) * push };
    }
    return { x, y };
  }, [mouseX, mouseY]);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    ctx.strokeStyle = 'rgba(28,28,34,0.07)';
    ctx.lineWidth = 0.5;

    const OFFSET = 8;
    const cols = Math.ceil((width + OFFSET) / GAP) + 1;
    const rows = Math.ceil((height + OFFSET) / GAP) + 1;

    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      for (let r = 0; r <= rows; r++) {
        const p = displace(c * GAP + OFFSET, r * GAP + OFFSET);
        if (r === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    for (let r = 0; r <= rows; r++) {
      ctx.beginPath();
      for (let c = 0; c <= cols; c++) {
        const p = displace(c * GAP + OFFSET, r * GAP + OFFSET);
        if (c === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }, [width, height, mouseX, mouseY, displace]);

  return (
    <canvas ref={canvasRef} style={{
      position: 'absolute', inset: 0, width: '100%', height: '100%',
      pointerEvents: 'none',
    }} />
  );
}

function HeroGridWrapper({ children, hidden }) {
  const wrapRef = React.useRef(null);
  const [dims, setDims] = React.useState({ w: 0, h: 0 });
  const [mouse, setMouse] = React.useState({ x: null, y: null });
  const raf = React.useRef(null);
  const pending = React.useRef(null);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const ro = new ResizeObserver(([entry]) => {
      setDims({ w: entry.contentRect.width, h: entry.contentRect.height });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const handlePointerMove = React.useCallback((e) => {
    const rect = wrapRef.current.getBoundingClientRect();
    pending.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    if (!raf.current) {
      raf.current = requestAnimationFrame(() => {
        setMouse(pending.current);
        raf.current = null;
      });
    }
  }, []);

  const handlePointerLeave = React.useCallback(() => {
    setMouse({ x: null, y: null });
  }, []);

  return (
    <div ref={wrapRef} onPointerMove={handlePointerMove} onPointerLeave={handlePointerLeave}
      style={{ position: 'relative' }}>
      {!hidden && <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
        <DotGrid width={dims.w} height={dims.h} mouseX={mouse.x} mouseY={mouse.y} />
      </div>}
      {children}
    </div>
  );
}

function GridSnappedHero({ children }) {
  const ref = React.useRef(null);
  const GAP = 16;
  const OFFSET = 8;

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const snap = () => {
      el.style.paddingBottom = '0px';
      const h = el.getBoundingClientRect().height;
      const top = el.offsetTop;
      const bottomPos = top + h;
      const remainder = (bottomPos - OFFSET) % GAP;
      const extra = remainder === 0 ? 0 : GAP - remainder;
      el.style.paddingBottom = extra + 'px';
    };
    snap();
    const ro = new ResizeObserver(snap);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  return <div ref={ref}>{children}</div>;
}

// Sliding spotlight overlay. Keeps the rect mounted so it animates between
// positions. When the active problem has no highlight, it keeps the last rect's
// position and fades to a full-screen dim via the fallback overlay.
function ProblemSpotlight({ active }) {
  const [rect, setRect] = React.useState(() => {
    const first = PROBLEMS.find(p => p.highlight);
    const h = first ? (Array.isArray(first.highlight) ? first.highlight[0] : first.highlight) : { top: '10%', left: '10%', width: '80%', height: '80%' };
    return h;
  });
  const raw = active != null ? PROBLEMS[active].highlight : null;
  const current = raw ? (Array.isArray(raw) ? raw[0] : raw) : null;
  const hasHighlight = !!current;

  React.useEffect(() => {
    if (current) setRect(current); // remember last real rect so the box keeps its place
  }, [current && current.top, current && current.left, current && current.width, current && current.height]);

  return (
    <React.Fragment>
      {/* full dim shown only when there is no specific highlight */}
      <div className="problem-overlay" style={{ opacity: hasHighlight ? 0 : 1 }} />
      {/* sliding spotlight; hidden (faded) when no highlight */}
      <div className="problem-spotlight" style={{
        top: rect.top, left: rect.left, width: rect.width, height: rect.height,
        opacity: hasHighlight ? 1 : 0,
      }} />
    </React.Fragment>
  );
}

const PILLARS = [
  {
    id: 'marketing',
    label: 'Marketing',
    desc: 'Approachable, visual pages like cloudflare.com',
    example: 'cloudflare.com',
    img: '../assets/cloudflare/marketing.png',
  },
  {
    id: 'content',
    label: 'Content',
    desc: 'Information rich sites like our blog and Dev Docs',
    example: 'blog.cloudflare.com',
    img: '../assets/cloudflare/content.png',
  },
  {
    id: 'product',
    label: 'Product',
    desc: 'Scalable, built with Cloudflare\'s design system.',
    example: 'Cloudflare Dashboard',
    img: '../assets/cloudflare/product.png',
  },
];

function VennDiagram() {
  const [userHovered, setUserHovered] = React.useState(null);
  const [autoIdx, setAutoIdx] = React.useState(0);
  const [viewRef, inView] = useInView();
  const VENN_SEQUENCE = ['marketing', 'content', 'product', 'radar'];
  const hovered = userHovered !== null ? userHovered : VENN_SEQUENCE[autoIdx];
  const setHovered = setUserHovered;

  // Auto-advance through circles; starts once in view, pauses while hovering.
  React.useEffect(() => {
    if (!inView || userHovered !== null) return;
    const id = setInterval(() => {
      setAutoIdx((a) => (a + 1) % VENN_SEQUENCE.length);
    }, 3000);
    return () => clearInterval(id);
  }, [inView, userHovered]);

  const r = 130;
  const cx = 200, cy = 200;
  const offset = 65;
  const circles = [
    { id: 'marketing', x: cx, y: cy - offset, labelX: cx, labelY: cy - offset - r * 0.5 },
    { id: 'content', x: cx - offset * 0.87, y: cy + offset * 0.5, labelX: cx - offset * 0.87 - r * 0.55, labelY: cy + offset * 0.5 + r * 0.25 },
    { id: 'product', x: cx + offset * 0.87, y: cy + offset * 0.5, labelX: cx + offset * 0.87 + r * 0.55, labelY: cy + offset * 0.5 + r * 0.25 },
  ];

  const activePillar = PILLARS.find(p => p.id === hovered);

  return (
    <div ref={viewRef} style={{ display: 'flex', gap: 24, alignItems: 'stretch' }}>
      <div style={{ width: 320, flexShrink: 0 }}>
        <svg viewBox="0 0 400 370" style={{ width: '100%' }}>
        <defs>
          {circles.map(c => (
            <clipPath key={`clip-${c.id}`} id={`clip-${c.id}`}>
              <circle cx={c.x} cy={c.y} r={r} />
            </clipPath>
          ))}
        </defs>
        {circles.map(c => (
          <g key={c.id}>
            <circle
              cx={c.x} cy={c.y} r={r}
              fill="transparent"
              stroke={hovered === c.id ? '#1C1C22' : '#D0D0D8'}
              strokeWidth={hovered === c.id ? 1.5 : 1}
              style={{ transition: 'stroke 0.2s ease, stroke-width 0.2s ease', cursor: 'pointer' }}
              onMouseEnter={() => setHovered(c.id)}
              onMouseLeave={() => setHovered(null)}
            />
            <text x={c.labelX} y={c.labelY} textAnchor="middle"
              style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 500, letterSpacing: '0.08em', fill: hovered === c.id ? '#1C1C22' : '#A8A8B3', transition: 'fill 0.2s', pointerEvents: 'none' }}>
              {c.id.toUpperCase()}
            </text>
          </g>
        ))}
        <g clipPath="url(#clip-marketing)">
          <g clipPath="url(#clip-content)">
            <circle cx={circles[2].x} cy={circles[2].y} r={r}
              fill={hovered === 'radar' ? '#D0D0D8' : 'transparent'}
              style={{ transition: 'fill 0.2s ease', cursor: 'pointer', pointerEvents: 'all' }}
              onMouseEnter={() => setHovered('radar')}
              onMouseLeave={() => setHovered(null)}
            />
          </g>
        </g>
        <text x={cx} y={cy + 4} textAnchor="middle"
          onMouseEnter={() => setHovered('radar')}
          onMouseLeave={() => setHovered(null)}
          style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 500, letterSpacing: '0.08em', fill: hovered === 'radar' ? '#1C1C22' : '#A8A8B3', cursor: 'pointer', transition: 'fill 0.2s' }}>
          RADAR
        </text>
      </svg>
      </div>

      <div style={{ flex: 1, minWidth: 200, display: 'flex', flexDirection: 'column' }}>
        {hovered === null && (
          <div className="problem-hint" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            HOVER CIRCLES TO EXPLORE
          </div>
        )}
        {hovered === 'radar' && (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
            <div style={{ ...mono, fontSize: 11, letterSpacing: '0.08em', color: '#A8A8B3', textTransform: 'uppercase', marginBottom: 8 }}>
              The intersection
            </div>
            <p style={{ ...bodyText, marginBottom: 12 }}>
              New Radar combines all three. 
            </p>
            <img src="../assets/cloudflare/new-radar.png" alt="Cloudflare Radar" style={{ width: '100%', flex: 1, minHeight: 120, objectFit: 'cover', borderRadius: 8 }} />
          </div>
        )}
        {activePillar && (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
            <div style={{ ...mono, fontSize: 11, letterSpacing: '0.08em', color: '#A8A8B3', textTransform: 'uppercase', marginBottom: 8 }}>
              {activePillar.label}
            </div>
            <p style={{ ...bodyText, marginBottom: 12 }}>{activePillar.desc}</p>
            <img src={activePillar.img} alt={activePillar.label} style={{ width: '100%', flex: 1, minHeight: 120, objectFit: 'cover', borderRadius: 8 }} />
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Map Stepper: Iteration Progression ── */
const MAP_STEPS = [
  { label: 'Early exploration', caption: 'Dense data visualization focused created too much information competing for attention.', video: '../assets/cloudflare/early-exploration.mov' },
  { label: 'Marketing direction', caption: 'Cleaner and more approachable, but risked making live data feel static or overly summarized.', video: '../assets/cloudflare/marketing-direction.mp4' },
  { label: 'Current direction', caption: 'Balances data richness with approachability. Still feels like live data, but easier to read and navigate.', video: '../assets/cloudflare/current-direction.mov' },
];

function MapStepper() {
  const [activeStep, setActiveStep] = React.useState(0);
  const [modalOpen, setModalOpen] = React.useState(false);
  const [paused, setPaused] = React.useState(false);
  const [viewRef, inView] = useInView();

  React.useEffect(() => {
    if (!modalOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') setModalOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [modalOpen]);

  // Auto-advance through steps; starts once in view, pauses on hover / modal.
  React.useEffect(() => {
    if (!inView || paused || modalOpen) return;
    const id = setInterval(() => {
      setActiveStep((s) => (s + 1) % MAP_STEPS.length);
    }, 3000);
    return () => clearInterval(id);
  }, [inView, paused, modalOpen]);

  const stepperBar = (clickMode) => (
    <div
      onMouseEnter={clickMode ? undefined : () => setPaused(true)}
      onMouseLeave={clickMode ? undefined : () => setPaused(false)}
      style={{ display: 'flex', alignItems: 'center', marginBottom: 16 }}>
      <div style={{ width: 16, height: 1, background: 'rgba(28,28,34,0.12)', flexShrink: 0 }} />
      {MAP_STEPS.map((step, i) => (
        <React.Fragment key={i}>
          <div
            onClick={() => setActiveStep(i)}
            onMouseEnter={clickMode ? undefined : () => setActiveStep(i)}
            className="problem-number"
            style={{
              cursor: 'pointer', flexShrink: 0, marginTop: 0,
              transition: 'background 0.5s ease, color 0.5s ease, border-color 0.5s ease',
              ...(i <= activeStep ? { background: '#1C1C22', color: '#fff', borderColor: '#1C1C22' } : {}),
            }}
          >
            {i + 1}
          </div>
          {i < MAP_STEPS.length - 1 && (
            <div style={{ flex: 1, height: 1, background: 'rgba(28,28,34,0.12)', position: 'relative', overflow: 'hidden' }}>
              <div style={{
                position: 'absolute', top: 0, left: 0, bottom: 0,
                width: i < activeStep ? '100%' : '0%',
                background: '#1C1C22',
                transition: 'width 0.6s cubic-bezier(0.4,0,0.2,1)',
              }} />
            </div>
          )}
        </React.Fragment>
      ))}
      <div style={{ width: 16, height: 1, background: 'rgba(28,28,34,0.12)', flexShrink: 0 }} />
    </div>
  );

  const stepImage = (
    <video
      key={MAP_STEPS[activeStep].video}
      src={MAP_STEPS[activeStep].video}
      autoPlay muted loop playsInline
      style={{
        width: '100%', aspectRatio: '16/9', objectFit: 'cover',
        borderRadius: 12, display: 'block', background: '#F4F4F6',
      }}
    />
  );

  const stepCaption = (
    <div style={{ marginTop: 12 }}>
      <div style={{ fontFamily: 'Switzer, sans-serif', fontWeight: 600, fontSize: 14, color: '#1C1C22', marginBottom: 4 }}>
        {MAP_STEPS[activeStep].label}
      </div>
      <p style={{ ...bodyText, fontSize: 13 }}>
        {MAP_STEPS[activeStep].caption}
      </p>
    </div>
  );

  return (
    <div ref={viewRef}>
      <div className="problem-hint" style={{ textAlign: 'left', marginBottom: 8 }}>HOVER OVER TIMELINE TO SEE ITERATIONS</div>
      {stepperBar(false)}

      <div className="problem-image-wrap" onClick={() => setModalOpen(true)} style={{ cursor: 'zoom-in', borderRadius: 12 }}>
        {stepImage}
        <button className="expand-btn" onClick={() => setModalOpen(true)}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
      </div>

      {stepCaption}

      {modalOpen && (
        <div className="image-modal-overlay" onClick={() => setModalOpen(false)}>
          <div className="modal-inner" onClick={e => e.stopPropagation()} style={{ height: 'calc(100vh - 64px)' }}>
            <div className="image-modal-panel" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
              {stepperBar(true)}
              <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>
                <video
                  key={MAP_STEPS[activeStep].video}
                  src={MAP_STEPS[activeStep].video}
                  autoPlay muted loop playsInline
                  style={{
                    flex: 1, minHeight: 0, width: '100%', objectFit: 'cover',
                    borderRadius: 12, display: 'block', background: '#F4F4F6',
                  }}
                />
                {stepCaption}
              </div>
            </div>
            <button className="modal-close-btn" onClick={() => setModalOpen(false)}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1C1C22" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Hierarchy Demo: Hover to Reveal ── */
const HIERARCHY_ITEMS = [
  { num: '01', title: 'Interactive map', desc: 'A global view of traffic and outages that orients users geographically.' },
  { num: '02', title: 'Tabbed data sections', desc: 'Organized categories that tease out the content Radar has.' },
  { num: '03', title: 'Trends and stories', desc: 'Links to the blog and social media connecting data to real-world events.' },
  { num: '04', title: 'About Radar', desc: 'Context on how Radar works and the global network behind its data.' },
];

function HierarchyDemo() {
  const [hovered, setHovered] = React.useState(null);
  const [modalOpen, setModalOpen] = React.useState(false);
  const imgWrapRef = React.useRef(null);
  const lockedRef = React.useRef(false);

  const handleHover = (i) => {
    lockedRef.current = false;
    setHovered(i);
    // For lower items (Trends and stories, About Radar), nudge the page so the
    // highlighted portion of the image is comfortably in view.
    if (i >= 2 && imgWrapRef.current) {
      const rect = imgWrapRef.current.getBoundingClientRect();
      // bottom of THIS region in viewport coordinates
      const regionBottomPct = parseFloat(regions[i].top) + parseFloat(regions[i].height);
      const regionBottom = rect.top + rect.height * (regionBottomPct / 100);
      const margin = 40;
      const overshoot = regionBottom - (window.innerHeight - margin);
      if (overshoot > 0) {
        // Keep this card highlighted through the auto-scroll even though the
        // cursor will slide off it. The lock is released on the user's next
        // manual scroll or when they hover another card.
        lockedRef.current = true;
        window.scrollBy({ top: overshoot, behavior: 'smooth' });
      }
    }
  };

  const handleLeave = () => {
    if (lockedRef.current) return;
    setHovered(null);
  };

  // Modal is click-only; keep a ref just for potential layout use.
  const modalPanelRef = React.useRef(null);
  const modalImgRef = React.useRef(null);

  React.useEffect(() => {
    // A user-initiated scroll releases the lock (and clears the highlight).
    const onWheel = () => {
      if (lockedRef.current) {
        lockedRef.current = false;
        setHovered(null);
      }
    };
    window.addEventListener('wheel', onWheel, { passive: true });
    window.addEventListener('touchmove', onWheel, { passive: true });
    return () => {
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('touchmove', onWheel);
    };
  }, []);

  const regions = [
    { top: '0%', height: '40%' },
    { top: '39%', height: '19%' },
    { top: '59%', height: '24%' },
    { top: '85%', height: '15%' },
  ];

  React.useEffect(() => {
    if (!modalOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') setModalOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [modalOpen]);

  const overlay = () => hovered !== null && (() => {
    const t = parseFloat(regions[hovered].top);
    const b = t + parseFloat(regions[hovered].height);
    const xInset = 1; // % of grey border left visible on each side
    const l = xInset, r = 100 - xInset;
    const cut = `${l}% ${t}%, ${l}% ${b}%, ${r}% ${b}%, ${r}% ${t}%, ${l}% ${t}%`;
    return (
      <React.Fragment>
        <div style={{
          position: 'absolute', inset: 0,
          background: 'rgba(0,0,0,0.4)',
          transition: 'clip-path 0.25s ease',
          pointerEvents: 'none',
          clipPath: `polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, ${cut})`,
        }} />
        <div style={{
          position: 'absolute',
          top: regions[hovered].top,
          left: xInset + '%', right: xInset + '%',
          height: regions[hovered].height,
          boxShadow: 'inset 0 0 0 2px rgba(255,255,255,0.9)',
          transition: 'all 0.25s ease',
          pointerEvents: 'none',
        }} />
      </React.Fragment>
    );
  })();

  return (
    <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', width: '100%', maxWidth: '100%' }}>
      <div style={{ flex: '2 1 0', minWidth: 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
        {/* text column */}
        <div className="problem-hint" style={{ textAlign: 'left', marginBottom: 4 }}>HOVER TO VIEW</div>
        {HIERARCHY_ITEMS.map((item, i) => (
          <div key={i}
            onMouseEnter={() => handleHover(i)}
            onMouseLeave={handleLeave}
            style={{
              padding: '12px 8px',
              background: hovered === i ? '#F4F4F6' : 'transparent',
              borderRadius: 8, cursor: 'pointer',
              transition: 'background 0.2s ease',
              display: 'flex', gap: 4, alignItems: 'flex-start',
            }}>
            <span style={{
              ...mono, fontSize: 12, fontWeight: 500,
              color: hovered === i ? '#1C1C22' : '#D0D0D8',
              lineHeight: 1.4, transition: 'color 0.2s ease', flexShrink: 0,
            }}>
              {item.num}
            </span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontFamily: 'Switzer, sans-serif', fontWeight: 600, fontSize: 15,
                color: hovered === i ? '#1C1C22' : '#6E6E78',
                marginBottom: 4, transition: 'color 0.2s ease',
              }}>
                {item.title}
              </div>
              <div style={{ ...bodyText, fontSize: 13, color: '#6E6E78' }}>
                {item.desc}
              </div>
            </div>
          </div>
        ))}
      </div>

      <div ref={imgWrapRef} style={{ flex: '3 1 0', minWidth: 0, position: 'relative' }}>
        <div className="problem-image-wrap" style={{
          width: '100%', lineHeight: 0,
          border: '1px solid rgba(28,28,34,0.08)',
          borderRadius: 12, overflow: 'hidden', position: 'relative',
        }}>
          <img src="../assets/cloudflare/radar-final.png" alt="New Cloudflare Radar landing page" style={{
            display: 'block', width: '100%', height: 'auto',
          }} />
          {overlay()}
          <button className="expand-btn" onClick={() => setModalOpen(true)}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
        </div>
      </div>

      {modalOpen && (
        <div className="image-modal-overlay" onClick={() => setModalOpen(false)}>
          <div className="modal-inner" onClick={e => e.stopPropagation()} style={{ maxWidth: '90vw' }}>
            <div className="image-modal-panel" ref={modalPanelRef} style={{ maxWidth: 'none', width: '90vw' }}>
              <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start' }}>
      <div style={{ flex: '1 1 0', minWidth: 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <div className="problem-hint" style={{ textAlign: 'left', marginBottom: 4 }}>CLICK TO VIEW</div>
                  {HIERARCHY_ITEMS.map((item, i) => (
                    <div key={i}
                      onClick={() => setHovered(i)}
                      style={{
                        padding: '10px 8px',
                        background: hovered === i ? '#F4F4F6' : 'transparent',
                        borderRadius: 8, cursor: 'pointer',
                        transition: 'background 0.2s ease',
                        display: 'flex', gap: 4, alignItems: 'flex-start',
                      }}>
                      <span style={{
                        ...mono, fontSize: 12, fontWeight: 500,
                        color: hovered === i ? '#1C1C22' : '#D0D0D8',
                        lineHeight: 1.4, flexShrink: 0,
                      }}>{item.num}</span>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{
                          fontFamily: 'Switzer, sans-serif', fontWeight: 600, fontSize: 15,
                          color: hovered === i ? '#1C1C22' : '#6E6E78', marginBottom: 4,
                        }}>{item.title}</div>
                        <div style={{ ...bodyText, fontSize: 13, color: '#6E6E78' }}>{item.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div ref={modalImgRef} style={{ flex: '3 1 0', minWidth: 0, position: 'relative', lineHeight: 0, borderRadius: 8, overflow: 'hidden' }}>
                  <img src="../assets/cloudflare/radar-final.png" alt="New Cloudflare Radar landing page" style={{
                    display: 'block', width: '100%', height: 'auto',
                  }} />
                  {overlay()}
                </div>
              </div>
            </div>
            <button className="modal-close-btn" onClick={() => setModalOpen(false)}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1C1C22" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Reading Order Demo: Hover to Reveal (wireframe) ── */
const READING_ORDER_ITEMS = [
  { num: '01', title: 'Interactive map', desc: 'A global view of traffic and outages that orients users geographically.' },
  { num: '02', title: 'Tabbed data sections', desc: 'Organized categories that tease out the content Radar has.' },
  { num: '03', title: 'Trends and stories', desc: 'Links to the blog and social media connecting data to real-world events.' },
  { num: '04', title: 'About Radar', desc: 'Context on how Radar works and the global network behind its data.' },
];

const RO_BLUE = '#046EEB';
const RO_TINT = 'rgba(4,110,235,0.04)';
const RO_GREY = '#D7D9DD';
const RO_GREY_SOFT = '#E6E8EB';

/* Real world map (flekschas/simple-world-map). Raw SVG paths live in a
   <script type="text/worldmap"> block; we inject them and control color via `fill`. */
const WORLD_MAP_SVG = (() => {
  try {
    const el = document.getElementById('world-map-data');
    return el ? el.textContent : '';
  } catch { return ''; }
})();
const WORLD_MAP_VIEWBOX = '30.767 241.591 784.077 458.627';

function WorldMap({ fill }) {
  return (
    <svg viewBox={WORLD_MAP_VIEWBOX} width="100%" height="100%" preserveAspectRatio="xMidYMid meet"
      fill={fill} stroke="none" style={{ transition: 'fill 0.25s ease', display: 'block' }}
      dangerouslySetInnerHTML={{ __html: WORLD_MAP_SVG }} />
  );
}

/* Simplified SVG wireframe of the landing page. `active` (0-3) recolors a region. */
function WireframeSVG({ active }) {
  const EASE = 'cubic-bezier(0.4,0,0.2,1)';
  const bar = (x, y, w, h, i, { accent = false, soft = false } = {}) => {
    const on = active === i;
    const fill = on && accent ? RO_BLUE : (soft ? RO_GREY_SOFT : RO_GREY);
    return <rect x={x} y={y} width={w} height={h} rx="3" fill={fill} style={{ transition: `fill 0.5s ${EASE}` }} />;
  };
  // Region vertical bounds [y, height] keyed by index; used by the sliding highlight.
  const REGION_BOUNDS = [[10, 240], [270, 240], [524, 196], [734, 72]];
  const regionBg = () => null; // replaced by a single sliding highlight box

  return (
    <svg viewBox="0 0 600 812" width="100%" style={{ display: 'block' }} role="img" aria-label="Radar landing page wireframe">
      <rect x="0" y="0" width="600" height="812" fill="#FFFFFF" />

      {/* Sliding highlight box: travels down to the active region */}
      {(() => {
        const [ry, rh] = REGION_BOUNDS[active] || REGION_BOUNDS[0];
        return (
          <rect x="6" width="588"
            y={ry} height={rh} rx="8"
            fill={RO_TINT} stroke={RO_BLUE} strokeOpacity="0.25"
            style={{ transition: `y 0.55s ${EASE}, height 0.55s ${EASE}` }} />
        );
      })()}

      {/* ── Region 0: Interactive map ── */}
      {regionBg(10, 240, 0)}
      {bar(24, 20, 120, 14, 0, { accent: true })}
      {bar(24, 42, 200, 7, 0, { soft: true })}
      {bar(500, 20, 76, 22, 0, { soft: true })}

/* Cropped video with hover controls + expand-to-modal */
function CroppedVideoStage({ src, aspectRatio, top, left, width, radius = 12, topRadius }) {
  const videoRef = React.useRef(null);
  const [playing, setPlaying] = React.useState(true);
  const [muted, setMuted] = React.useState(true);
  const [progress, setProgress] = React.useState(0);

  const togglePlay = () => {
    const v = videoRef.current;
    if (!v) return;
    if (v.paused) { v.play(); } else { v.pause(); }
  };

  const toggleMute = (e) => {
    e.stopPropagation();
    const v = videoRef.current;
    if (!v) return;
    v.muted = !v.muted;
    setMuted(v.muted);
  };

  const onSeek = (e) => {
    e.stopPropagation();
    const v = videoRef.current;
    if (!v || !v.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    v.currentTime = pct * v.duration;
    setProgress(pct * 100);
  };

  return (
    <div className="cv-stage" style={{
      width: '100%', aspectRatio, overflow: 'hidden',
      borderRadius: radius, border: '1px solid rgba(28,28,34,0.08)', background: '#FFFFFF',
      ...(topRadius !== undefined ? { borderTopLeftRadius: topRadius, borderTopRightRadius: topRadius } : {}),
      position: 'relative',
    }}>
      <video
        ref={videoRef}
        src={src}
        autoPlay muted loop playsInline
        onClick={togglePlay}
        onTimeUpdate={(e) => {
          const v = e.currentTarget;
          if (v.duration) setProgress((v.currentTime / v.duration) * 100);
        }}
        onPlay={() => setPlaying(true)}
        onPause={() => setPlaying(false)}
        style={{
          position: 'absolute', top, left, width, height: 'auto',
          display: 'block', cursor: 'pointer',
        }}
      />
      {/* Hover control bar */}
      <div className="cv-controls" style={{
        position: 'absolute', left: 0, right: 0, bottom: 0,
        display: 'flex', alignItems: 'center', gap: 12,
        padding: '20px 14px 12px',
        background: 'linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0))',
        opacity: 0, transition: 'opacity 0.2s ease', zIndex: 3,
      }}>
        <button onClick={togglePlay} aria-label={playing ? 'Pause' : 'Play'} style={{
          border: 'none', background: 'none', cursor: 'pointer', padding: 0,
          color: '#fff', display: 'flex', alignItems: 'center',
        }}>
          {playing ? (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
          ) : (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 5 19 12 7 19" /></svg>
          )}
        </button>
        <div onClick={onSeek} style={{
          flex: 1, height: 4, background: 'rgba(255,255,255,0.3)', borderRadius: 2,
          cursor: 'pointer', position: 'relative',
        }}>
          <div style={{
            position: 'absolute', top: 0, left: 0, height: '100%',
            width: progress + '%', background: '#F6821F', borderRadius: 2,
          }} />
        </div>
        <button onClick={toggleMute} aria-label={muted ? 'Unmute' : 'Mute'} style={{
          border: 'none', background: 'none', cursor: 'pointer', padding: 0,
          color: '#fff', display: 'flex', alignItems: 'center',
        }}>
          {muted ? (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
          ) : (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>
          )}
        </button>
      </div>
    </div>
  );
}

/* Paragraph whose highlighted phrases animate in when scrolled into view,
   matching the home-page blurb. Pass JSX children with <span className="scroll-highlight">. */
function ScrollHighlightPara({ style, children }) {
  const ref = React.useRef(null);
  const [active, setActive] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      setActive(entry.isIntersecting);
    }, { rootMargin: '-35% 0px -35% 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <p ref={ref} className={active ? 'highlight-active' : ''} style={style}>
      {children}
    </p>
  );
}

            <div className="content-pad" style={{ marginBottom: 48 }}>
              <h2 style={sectionLabel}>Impact</h2>
            </div>
            <div className="content-pad" style={{ display: 'flex', flexDirection: 'column', gap: 'clamp(40px, 5vw, 64px)' }}>
              <InsightRow heading="Approved and shipping">
                Presented to and approved by Cloudflare's CTO, Dane Knecht.{' '}
                {RADAR_LIVE ? (
                  <a href={RADAR_URL} target="_blank" rel="noopener noreferrer" style={{ color: RO_BLUE, fontWeight: 600, textDecoration: 'none' }}>
                    The updated site is now live!
                  </a>
                ) : (
                  <React.Fragment>The redesigned Radar is scheduled to go live in <strong>mid-October</strong>.</React.Fragment>
                )}
              </InsightRow>
              <InsightRow heading="Led end-to-end">
                I led the redesign from concept through final direction, and continue to support the dev team through implementation.
              </InsightRow>
              <InsightRow heading="A foundation for the future">
                A first step toward making real-time insights across security, performance, and traffic accessible to everyone, not just technical experts.
              </InsightRow>
            </div>
          </section>

          <section id="reflections" style={{ paddingTop: 48, paddingBottom: 80, scrollMarginTop: 72 }}>
            <div className="content-pad" style={{ marginBottom: 48 }}>
              <h2 style={sectionLabel}>Reflections</h2>
            </div>
            <div className="content-pad" style={{ display: 'flex', flexDirection: 'column', gap: 'clamp(40px, 5vw, 64px)' }}>
              <InsightRow heading="Designing for a spectrum of expertise">
                Radar's audience spans every level of Internet expertise, so there was no "average" user to design for. I designed for the least technical users, trusting that meeting the highest needs lifts the experience for everyone, without removing the depth power users rely on.
              </InsightRow>
              <InsightRow heading="Designing with data literacy">
                Understanding the data, and the limits of each data set, was core to the work. Knowing what a metric represents and where its edges are shaped how I visualized it, keeping the redesign approachable while staying honest about what the data can say.
              </InsightRow>
            </div>
          </section>
          </React.Fragment>}
        </main>
      </div>

      <EWFooter />
    </div>
    </HeroGridWrapper>
  );
}

function PasswordGate({ children }) {
  const [unlocked, setUnlocked] = React.useState(() => {
    try { return sessionStorage.getItem('cf-unlocked') === '1'; } catch { return false; }
  });
  const [value, setValue] = React.useState('');
  const [error, setError] = React.useState(false);
  const inputRef = React.useRef(null);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (value === 'cloudflare26') {
      try { sessionStorage.setItem('cf-unlocked', '1'); } catch {}
      setUnlocked(true);
    } else {
      setError(true);
      setValue('');
      inputRef.current?.focus();
    }
  };

  if (unlocked) return children;

  return (
    <div style={{
      minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'Switzer, sans-serif',
    }}>
      <form onSubmit={handleSubmit} style={{ textAlign: 'center', width: 280 }}>
        <div style={{
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 500,
          letterSpacing: '0.1em', textTransform: 'uppercase', color: '#7A7A85', marginBottom: 24,
        }}>
          Password protected
        </div>
        <input
          ref={inputRef}
          type="password"
          value={value}
          onChange={(e) => { setValue(e.target.value); setError(false); }}
          placeholder="Enter password"
          autoFocus
          style={{
            width: '100%', padding: '10px 14px', fontSize: 14,
            fontFamily: 'Switzer, sans-serif',
            border: `1px solid ${error ? '#E05252' : 'rgba(28,28,34,0.15)'}`,
            borderRadius: 6, outline: 'none', color: '#1C1C22',
            transition: 'border-color 0.15s ease',
            boxSizing: 'border-box',
          }}
          onFocus={(e) => e.target.style.borderColor = error ? '#E05252' : '#046EEB'}
          onBlur={(e) => e.target.style.borderColor = error ? '#E05252' : 'rgba(28,28,34,0.15)'}
        />
        {error && (
          <div style={{ fontSize: 13, color: '#E05252', marginTop: 8 }}>
            Incorrect password
          </div>
        )}
        <div style={{ marginTop: 24, fontSize: 13, color: '#7A7A85', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
          <span>Need access? Get in touch:</span>
          <a href="mailto:sophiacalfred@gmail.com" style={{ color: '#7A7A85', transition: 'color 0.15s ease', display: 'flex' }} onMouseEnter={(e) => e.currentTarget.style.color = '#1C1C22'} onMouseLeave={(e) => e.currentTarget.style.color = '#7A7A85'}>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"></path></svg>
          </a>
          <a href="https://www.linkedin.com/in/sophia-alfred-sca07/" target="_blank" rel="noopener noreferrer" style={{ color: '#7A7A85', transition: 'color 0.15s ease', display: 'flex' }} onMouseEnter={(e) => e.currentTarget.style.color = '#1C1C22'} onMouseLeave={(e) => e.currentTarget.style.color = '#7A7A85'}>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M216,24H40A16,16,0,0,0,24,40V216a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V40A16,16,0,0,0,216,24Zm0,192H40V40H216V216ZM96,112v64a8,8,0,0,1-16,0V112a8,8,0,0,1,16,0Zm88,28v36a8,8,0,0,1-16,0V140a20,20,0,0,0-40,0v36a8,8,0,0,1-16,0V112a8,8,0,0,1,15.79-1.78A36,36,0,0,1,184,140ZM100,84A12,12,0,1,1,88,72,12,12,0,0,1,100,84Z"></path></svg>
