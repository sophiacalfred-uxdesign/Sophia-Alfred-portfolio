<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>The Living Record — Sophia Alfred</title>
  <link rel="icon" href="../assets/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    @font-face {
      font-family: 'Self Modern';
      src: url('../assets/fonts/Self_Modern_Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF4; color: #1C1C22; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #FFFBF4; }
    ::-webkit-scrollbar-thumb { background: #A8A8B3; border-radius: 3px; }

    .sidenav {
      position: sticky; top: 56px;
      width: 199px; min-width: 199px;
      height: calc(100vh - 56px);
      padding: 18px;
      background: #FFFBF4;
      border-right: 1px solid rgba(0,0,0,0.06);
      display: flex; flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0; align-self: flex-start;
    }
    .sidenav-top { display: flex; flex-direction: column; gap: 12px; }
    .sidenav-link {
      font-family: 'IBM Plex Mono', monospace; font-weight: 400;
      font-size: 11px; letter-spacing: 0.06em; line-height: 165%;
      text-transform: uppercase; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      color: #6E6E78; transition: color 0.15s ease;
    }
    .sidenav-link.active { color: #ED5632; font-weight: 500; }
    .sidenav-link:hover { color: #5A5A65; }
    .sidenav-link.home { color: #5A5A65; margin-bottom: 10px; }
    .sidenav-link svg { flex-shrink: 0; }

    .content-pad { padding: 0 clamp(40px, 7vw, 120px); }

    .expandable-img { cursor: zoom-in; transition: opacity 0.15s; }
    .expandable-img:hover { opacity: 0.9; }

    .img-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
    }
    .img-overlay.active { display: flex; }
    .img-overlay-close {
      position: absolute; top: 20px; right: 24px;
      background: none; border: none; color: #fff;
      font-family: 'IBM Plex Mono', monospace; font-size: 13px;
      cursor: pointer; letter-spacing: 0.05em; opacity: 0.7;
    }
    .img-overlay-close:hover { opacity: 1; }
    #img-overlay-img { max-width: 90vw; max-height: 72vh; object-fit: contain; cursor: grab; border-radius: 4px; }

    .img-overlay-center {
      display: flex; flex-direction: column; align-items: center;
      max-width: 90vw;
    }
    .img-overlay-caption-text {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      color: rgba(255,255,255,0.9); letter-spacing: 0.05em;
      text-align: center; margin-top: 14px; max-width: 560px;
      line-height: 1.65;
    }
    .img-overlay-prev, .img-overlay-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); font-size: 26px;
      width: 44px; height: 44px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; padding: 0; line-height: 1;
    }
    .img-overlay-prev { left: 20px; }
    .img-overlay-next { right: 20px; }
    .img-overlay-prev:hover, .img-overlay-next:hover {
      background: rgba(255,255,255,0.18); color: #fff;
    }
    .img-overlay-prev.hidden, .img-overlay-next.hidden { display: none; }

    .moodboard-tab {
      cursor: pointer; border: none; text-align: center; border-radius: 4px;
      padding: 16px 12px; transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      position: relative;
    }
    .moodboard-tab:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.10);
      filter: brightness(0.96);
    }
    .moodboard-tab:active { transform: translateY(-1px); }
    .moodboard-tab.is-active {
      box-shadow: inset 0 0 0 1px #1C1C22;
    }
    .moodboard-tab.is-active::after {
      content: ''; position: absolute; bottom: -10px; left: 50%;
      transform: translateX(-50%);
      border-left: 7px solid transparent; border-right: 7px solid transparent;
      border-top: 8px solid #1C1C22;
    }
    @keyframes moodboardIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .moodboard-img-enter { animation: moodboardIn 0.3s ease forwards; }

    @media (max-width: 768px) {
      .sidenav { display: none; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- Image overlay -->
<div class="img-overlay" id="img-overlay">
  <button class="img-overlay-close" id="img-overlay-close">✕ Close</button>
  <button class="img-overlay-prev" id="img-overlay-prev">‹</button>
  <div class="img-overlay-center">
    <img id="img-overlay-img" src="" alt="">
    <div id="img-overlay-caption" class="img-overlay-caption-text"></div>
  </div>

</div>

<div id="root"></div>
<script type="text/babel">

function EWNav({ activePage = 'work' }) {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const activeColor   = scrolled ? '#1C1C22' : 'rgba(255,255,255,0.95)';
  const inactiveColor = scrolled ? '#7A7A85' : 'rgba(255,255,255,0.55)';
  const hoverColor    = scrolled ? '#1C1C22' : 'rgba(255,255,255,0.95)';
  return (
    <nav style={{
      width:'100%', height:56,
      background: scrolled ? 'rgba(255,251,244,0.92)' : 'rgba(0,0,0,0.01)',
      backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)',
      borderBottom: scrolled ? '1px solid rgba(28,28,34,0.07)' : '1px solid rgba(255,255,255,0.08)',
      display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px',
      position:'fixed', top:0, zIndex:100, boxSizing:'border-box',
      transition:'background 0.35s ease, border-color 0.35s ease',
    }}>
      <a href="../index.html" style={{ display:'flex', alignItems:'center', textDecoration:'none' }}>
        <img src={scrolled ? '../assets/sophia-logo.png' : '../assets/sophia-logo-white.png'}
          alt="sophia alfred" style={{ height:28, display:'block', transition:'opacity 0.2s' }} />
      </a>
      <div style={{ display:'flex', gap:24 }}>
        {[['work','Work','../index.html#case-studies'],['about','About','../about.html'],['resume','Resume','../assets/sophia-resume.pdf']].map(([id,label,href]) =>
          <a key={id} href={href} target={id==='resume'?'_blank':undefined} rel={id==='resume'?'noopener noreferrer':undefined}
            style={{ fontFamily:'Manrope, sans-serif', fontWeight:500, fontSize:14, letterSpacing:'0.01em',
              textDecoration:'none', color: activePage===id ? activeColor : inactiveColor, transition:'color 0.2s' }}
            onMouseEnter={e=>e.target.style.color=hoverColor}
            onMouseLeave={e=>e.target.style.color=activePage===id?activeColor:inactiveColor}>
            {label}
          </a>
        )}
      </div>
    </nav>
  );
}

function EWFooter() {
  return (
    <footer style={{ background:'#1C1C23', boxShadow:'0px 4px 4px rgba(0,0,0,0.25)' }}>
      <div style={{ borderTop:'1px solid rgba(255,255,255,0.08)', padding:'40px 36px',
        display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:24 }}>
        <img src="../assets/sophia-logo-white.png" alt="sophia alfred" style={{ height:32, display:'block', opacity:0.9 }} />
        <div style={{ display:'flex', gap:48 }}>
          {[
            { heading:'say hi', links:[
              {label:'LinkedIn',href:'https://www.linkedin.com/in/sophia-alfred-sca07/'},
              {label:'Email',href:'mailto:sophiacalfred@gmail.com'},
              {label:'Resume',href:'../assets/sophia-resume.pdf',external:true},
            ]},
            { heading:'work', links:[
              {label:'The Living Record',href:'living-record.html'},
              {label:'Garden Tours',href:'garden-tours.html'},
              {label:'Yogapedia',href:'yogapedia.html'},
              {label:'My Art Gallery',href:'../about.html#gallery'},
            ]},
          ].map(col =>
            <div key={col.heading} style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <div style={{ fontFamily:'Manrope, sans-serif', fontWeight:500, fontSize:11,
                color:'rgba(255,255,255,0.5)', letterSpacing:'0.08em', textTransform:'lowercase', marginBottom:2 }}>{col.heading}</div>
              {col.links.map(l =>
                <a key={l.label} href={l.href} target={l.external?'_blank':undefined} rel={l.external?'noopener noreferrer':undefined}
                  style={{ fontFamily:'Manrope, sans-serif', fontSize:13, color:'rgba(255,255,255,0.35)',
                    letterSpacing:'0.01em', textDecoration:'none', transition:'color 0.2s' }}
                  onMouseEnter={e=>e.target.style.color='rgba(255,255,255,0.85)'}

                  {l.label}
                </a>
              )}
            </div>
          )}
        </div>
      </div>
      <div style={{ padding:'0 36px 24px', fontFamily:'Manrope, sans-serif', letterSpacing:'0.02em' }}>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.35)', marginBottom: 4 }}>Portfolio created with Claude Code :)</div>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.2)' }}>© 2026 Sophia Alfred</div>
      </div>

const SECTION_IDS = ['the-problem','discover','define','develop','final-solution','reflection'];
const NAV_LINKS = [
  { id:'the-problem',    label:'The Problem' },
  { id:'discover',       label:'Discover' },
  { id:'define',         label:'Define' },
  { id:'develop',        label:'Develop' },
  { id:'final-solution', label:'Solution' },
  { id:'reflection',     label:'Reflection' },
];

const ArrowLeft = () => (
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
    <path d="M7.5 2L3.5 6L7.5 10" stroke="#5A5A65" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const ArrowUp = () => (
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style={{ transform:'rotate(90deg)' }}>
    <path d="M7.5 2L3.5 6L7.5 10" stroke="#5A5A65" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

function SideNav() {
  const [active, setActive] = React.useState('the-problem');
  React.useEffect(() => {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin:'-56px 0px -70% 0px', threshold:0 });
    SECTION_IDS.forEach(id => { const el = document.getElementById(id); if (el) observer.observe(el); });
    return () => observer.disconnect();
  }, []);
  return (
    <aside className="sidenav">
      <div className="sidenav-top">
        <a href="../index.html" className="sidenav-link home"><ArrowLeft /> HOME</a>
        {NAV_LINKS.map(({id,label}) => (
          <a key={id} href={`#${id}`} className={`sidenav-link${active===id?' active':''}`}>{label}</a>
        ))}
      </div>
      <a href="#the-problem" className="sidenav-link home"
        onClick={e=>{ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); }}>
        <ArrowUp /> BACK TO TOP
      </a>
    </aside>
  );
}

const mono = { fontFamily:"'IBM Plex Mono', monospace" };
const sectionLabel = { ...mono, fontSize:11, fontWeight:500, letterSpacing:'0.1em', textTransform:'uppercase', color:'#ED5632', marginBottom:8, display:'block' };
const sectionHeading = { fontFamily:'Manrope, sans-serif', fontWeight:500, fontSize:'clamp(16px, 1.6vw, 20px)', lineHeight:1.35, color:'#1C1C22', marginBottom:12 };
const bodyText = { fontFamily:'Manrope, sans-serif', fontWeight:400, fontSize:14, lineHeight:'21px', color:'#7A7A85' };
const imgCaption = { fontFamily:"'IBM Plex Mono', monospace", fontSize:10, color:'#A8A8B3', letterSpacing:'0.06em', marginTop:8, display:'block' };
const divider = { borderTop:'1px solid rgba(28,28,34,0.08)', margin:'48px 0' };

}

function InsightCard({ number, text }) {

    <div style={{ display:'flex', gap:16, alignItems:'flex-start', paddingBottom:16, borderBottom:'1px solid rgba(28,28,34,0.07)' }}>
      <span style={{ ...mono, fontSize:11, color:'#ED5632', minWidth:24, paddingTop:1 }}>{number}</span>
      <span style={{ fontFamily:'Manrope, sans-serif', fontSize:14, color:'#5A5A65', lineHeight:'21px' }}>{text}</span>
    </div>

// Expandable image — wires up the plain-HTML overlay outside React
function ExpandableImg({ src, alt, style = {} }) {
  const handleClick = () => {
    if (window.openGallery) { window.openGallery([{ src }], 0); }
    else {
      const overlay = document.getElementById('img-overlay');
      const img     = document.getElementById('img-overlay-img');
      if (overlay && img) { img.src = src; overlay.classList.add('active'); }
    }
  };
  return (
    <img src={src} alt={alt} className="expandable-img"
      onClick={handleClick}
      style={{ display:'block', borderRadius:4, ...style }} />
  );
}

function LivingRecordPage() {

        <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.45)' }} />

<script>
  // Image overlay logic (outside React) — supports single images and galleries
  const overlay    = document.getElementById('img-overlay');
  const overlayImg = document.getElementById('img-overlay-img');
  const closeBtn   = document.getElementById('img-overlay-close');
  const prevBtn    = document.getElementById('img-overlay-prev');
  const nextBtn    = document.getElementById('img-overlay-next');
  const captionEl  = document.getElementById('img-overlay-caption');

  let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;
  let galleryImages = [], galleryIndex = 0;

  function applyTransform() {
    overlayImg.style.transform = `scale(${scale}) translate(${panX/scale}px,${panY/scale}px)`;
  }

  function showGalleryImage() {
    const item = galleryImages[galleryIndex];
    overlayImg.src = item.src || item;
    scale = 1; panX = 0; panY = 0; applyTransform();
    if (captionEl) {
      captionEl.innerHTML = item.title
        ? `<strong style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.8);margin-bottom:7px">${item.title}</strong>${item.desc || ''}`
        : '';
    }
    if (prevBtn) prevBtn.classList.toggle('hidden', galleryImages.length <= 1);
    if (nextBtn) nextBtn.classList.toggle('hidden', galleryImages.length <= 1);
  }

  window.openGallery = function(images, index) {
    galleryImages = images;
    galleryIndex  = index;
    showGalleryImage();
    overlay.classList.add('active');
  };

  function closeOverlay() { overlay.classList.remove('active'); }
  closeBtn.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

  prevBtn.addEventListener('click', () => {
    galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
    showGalleryImage();
  });
  nextBtn.addEventListener('click', () => {
    galleryIndex = (galleryIndex + 1) % galleryImages.length;
    showGalleryImage();
  });

  overlayImg.addEventListener('wheel', e => {
    e.preventDefault();
    scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.12 : 0.12)), 6);
    applyTransform();
  }, { passive: false });
  overlayImg.addEventListener('mousedown', e => {
    isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
    overlayImg.style.cursor = 'grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    panX = e.clientX - startX; panY = e.clientY - startY; applyTransform();
  });
  document.addEventListener('mouseup', () => { isDragging = false; overlayImg.style.cursor = 'grab'; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeOverlay();
    if (!overlay.classList.contains('active') || galleryImages.length <= 1) return;
    if (e.key === 'ArrowLeft')  { galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length; showGalleryImage(); }
    if (e.key === 'ArrowRight') { galleryIndex = (galleryIndex + 1) % galleryImages.length; showGalleryImage(); }
  });
</script>
