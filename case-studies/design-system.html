<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Design System Generator — Sophia Alfred</title>
  <link rel="icon" href="../assets/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    @font-face {
      font-family: 'Self Modern';
      src: url('../assets/fonts/Self_Modern_Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Light.otf') format('opentype'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Medium.otf') format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('../assets/fonts/switzer/Switzer-Semibold.otf') format('opentype'); font-weight: 600; font-style: normal; font-display: swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #FCFDFE; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(4,110,235,0.04); color: #046EEB; }
    ::-moz-selection { background: rgba(4,110,235,0.04); color: #046EEB; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #FCFDFE; }
    ::-webkit-scrollbar-thumb { background: #A8A8B3; border-radius: 3px; }
    @keyframes toastPop {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.85) translateY(4px); }
      15%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
      75%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) scale(0.95) translateY(-2px); }
    }
    .copied-toast {
      position: absolute; top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: #1C1C22; color: #fff;
      font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500;
      padding: 4px 12px; border-radius: 6px; white-space: nowrap;
      pointer-events: none;
      animation: toastPop 1.5s ease forwards;
    }
    @media (max-width: 768px) {
      .nav-links { display: none !important; }
      .hamburger-btn { display: flex !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "be635e73408243d99da7c4f6e98c90e7"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function EWNav({ activePage }) {
  const [copied, setCopied] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const handleCopyEmail = () => {
    try { navigator.clipboard.writeText('sophiacalfred@gmail.com'); } catch {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  React.useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [menuOpen]);

  const navLinks = [
    ['work', 'Work', '../index.html#case-studies'],
    ['about', 'About', '../about.html'],
    ['resume', 'Resume', '../assets/sophia-resume.pdf'],
  ];

  return (
    <React.Fragment>
      <nav style={{
        width: '100%', height: 56, background: '#FCFDFE',
        borderBottom: '1px solid rgba(28,28,34,0.07)',
        display: 'flex', alignItems: 'center',
        justifyContent: 'space-between', padding: '0 24px',
        position: 'sticky', top: 0, zIndex: 100, boxSizing: 'border-box'
      }}>
        <a href="../index.html" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
          <img src="../assets/sophia-logo.png" alt="sophia alfred" style={{ height: 28, display: 'block' }} />
        </a>

        <button className="hamburger-btn" onClick={() => setMenuOpen(true)} style={{
          display: 'none', background: 'none', border: 'none', padding: 4, cursor: 'pointer',
          color: '#1C1C22', alignItems: 'center', justifyContent: 'center'
        }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div className="nav-links" style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
          {navLinks.map(([id, label, href]) =>
            <a key={id} href={href}
              target={id === 'resume' ? '_blank' : undefined}
              rel={id === 'resume' ? 'noopener noreferrer' : undefined}
              style={{
                fontFamily: 'Switzer, sans-serif', fontWeight: 400, fontSize: 14,
                letterSpacing: '0.01em',
                textDecoration: activePage === id ? 'underline' : 'none',
                textUnderlineOffset: '4px',
                color: activePage === id ? '#1C1C22' : '#67676F', transition: 'color 0.2s',
              }}
              onMouseEnter={e => { e.target.style.color = '#1C1C22'; e.target.style.textDecoration = 'underline'; }}
              onMouseLeave={e => { e.target.style.color = activePage === id ? '#1C1C22' : '#67676F'; e.target.style.textDecoration = activePage === id ? 'underline' : 'none'; }}>
              {label}
            </a>
          )}
          <div style={{ width: 1, height: 16, background: 'rgba(28,28,34,0.12)' }} />
          <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
            <button onClick={handleCopyEmail} style={{
              background: 'none', border: 'none', padding: 0, cursor: 'pointer',
              color: '#67676F', transition: 'color 0.15s ease', display: 'flex',
            }}
              onMouseEnter={e => e.currentTarget.style.color = '#1C1C22'}
              onMouseLeave={e => e.currentTarget.style.color = '#67676F'}>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"></path></svg>
            </button>
            {copied && <div className="copied-toast">Email copied!</div>}
          </div>
          <a href="https://www.linkedin.com/in/sophia-alfred-sca07/" target="_blank" rel="noopener noreferrer"
            style={{ color: '#67676F', transition: 'color 0.15s ease', display: 'flex' }}
            onMouseEnter={e => e.currentTarget.style.color = '#1C1C22'}
            onMouseLeave={e => e.currentTarget.style.color = '#67676F'}>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256"><path d="M216,24H40A16,16,0,0,0,24,40V216a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V40A16,16,0,0,0,216,24Zm0,192H40V40H216V216ZM96,112v64a8,8,0,0,1-16,0V112a8,8,0,0,1,16,0Zm88,28v36a8,8,0,0,1-16,0V140a20,20,0,0,0-40,0v36a8,8,0,0,1-16,0V112a8,8,0,0,1,15.79-1.78A36,36,0,0,1,184,140ZM100,84A12,12,0,1,1,88,72,12,12,0,0,1,100,84Z"></path></svg>
          </a>
        </div>
      </nav>

      {menuOpen && (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 200,
          background: 'rgba(252,253,254,0.97)', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)',
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 32,
        }}>
          <button onClick={() => setMenuOpen(false)} style={{
            position: 'absolute', top: 16, right: 20,
            background: 'none', border: 'none', cursor: 'pointer', color: '#1C1C22', padding: 4,
          }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>

          {navLinks.map(([id, label, href]) =>
            <a key={id} href={href}
              onClick={() => setMenuOpen(false)}
              target={id === 'resume' ? '_blank' : undefined}
              rel={id === 'resume' ? 'noopener noreferrer' : undefined}
              style={{
                fontFamily: 'Switzer, sans-serif', fontWeight: 400, fontSize: 22,
                color: '#1C1C22', textDecoration: 'none', letterSpacing: '0.01em',
              }}>
              {label}
            </a>
          )}

          <div style={{ width: 40, height: 1, background: 'rgba(28,28,34,0.12)' }} />

          <div style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
            <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
              <button onClick={handleCopyEmail} style={{
                background: 'none', border: 'none', padding: 0, cursor: 'pointer',
                color: '#67676F', display: 'flex',
              }}>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"></path></svg>
              </button>
              {copied && <div className="copied-toast">Email copied!</div>}
            </div>
            <a href="https://www.linkedin.com/in/sophia-alfred-sca07/" target="_blank" rel="noopener noreferrer"
              style={{ color: '#67676F', display: 'flex' }}>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M216,24H40A16,16,0,0,0,24,40V216a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V40A16,16,0,0,0,216,24Zm0,192H40V40H216V216ZM96,112v64a8,8,0,0,1-16,0V112a8,8,0,0,1,16,0Zm88,28v36a8,8,0,0,1-16,0V140a20,20,0,0,0-40,0v36a8,8,0,0,1-16,0V112a8,8,0,0,1,15.79-1.78A36,36,0,0,1,184,140ZM100,84A12,12,0,1,1,88,72,12,12,0,0,1,100,84Z"></path></svg>
            </a>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function EWFooter() {
  return (
    <footer style={{ background: '#1C1C23', boxShadow: '0px 4px 4px rgba(0,0,0,0.25)' }}>
      <div style={{
        borderTop: '1px solid rgba(255,255,255,0.08)', padding: '40px 36px',
        display: 'flex', justifyContent: 'space-between',
        alignItems: 'flex-start', flexWrap: 'wrap', gap: 24
      }}>
        <img src="../assets/sophia-logo-white.png" alt="sophia alfred"
          style={{ height: 32, display: 'block', opacity: 0.9 }} />
        <div style={{ display: 'flex', gap: 48 }}>
          {[
            { heading: 'say hi', links: [
              { label: 'LinkedIn', href: 'https://www.linkedin.com/in/sophia-alfred-sca07/' },
              { label: 'Email',    href: 'mailto:sophiacalfred@gmail.com' },
              { label: 'Resume',   href: '../assets/sophia-resume.pdf', external: true },
            ]},
            { heading: 'work', links: [
              { label: 'Cloudflare Radar',  href: 'cloudflare.html' },
              { label: 'The Living Record', href: 'living-record.html' },
              { label: 'Yogapedia',         href: 'yogapedia.html' },
              { label: 'My Art Gallery',    href: '../about.html#gallery' },
            ]},
          ].map(col =>
            <div key={col.heading} style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{
                fontFamily: 'Switzer, sans-serif', fontWeight: 500, fontSize: 11,
                color: 'rgba(255,255,255,0.5)', letterSpacing: '0.08em',
                textTransform: 'lowercase', marginBottom: 2,
              }}>{col.heading}</div>
              {col.links.map(l =>
                <a key={l.label} href={l.href}
                  target={l.external ? '_blank' : undefined}
                  rel={l.external ? 'noopener noreferrer' : undefined}
                  style={{
                    fontFamily: 'Switzer, sans-serif', fontSize: 13,
                    color: 'rgba(255,255,255,0.35)', letterSpacing: '0.01em',
                    textDecoration: 'none', transition: 'color 0.2s'
                  }}
                  onMouseEnter={e => e.target.style.color = 'rgba(255,255,255,0.85)'}
                  onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.35)'}>
                  {l.label}
                </a>
              )}
            </div>
          )}
        </div>
      </div>
      <div style={{
        padding: '0 36px 24px', fontFamily: 'Switzer, sans-serif',
        letterSpacing: '0.02em',
      }}>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.35)', marginBottom: 4 }}>Portfolio created with Claude Code :)</div>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.2)' }}>© 2026 Sophia Alfred</div>
      </div>
    </footer>
  );
}

const label = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: '0.08em', color: '#A8A8B3', textTransform: 'uppercase', marginBottom: 12 };
const heading = { fontFamily: "'Self Modern', serif", fontWeight: 400, fontSize: 28, lineHeight: 1.3, color: '#1C1C22', marginBottom: 16 };
const body = { fontFamily: 'Switzer, sans-serif', fontWeight: 400, fontSize: 16, lineHeight: '28px', color: '#5A5A65' };

function DesignSystemPage() {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: '#FCFDFE' }}>
      <EWNav />

      <div style={{ width: '100%', aspectRatio: '16/7', background: '#1C1C22', position: 'relative', overflow: 'hidden' }}>
        <video src="../assets/design-system-cover.mp4" autoPlay muted loop playsInline
          style={{ width: '100%', height: '100%', objectFit: 'cover', position: 'absolute', inset: 0 }} />
        <div style={{
          position: 'absolute', inset: 0, background: 'rgba(28,28,34,0.55)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexDirection: 'column', gap: 16, padding: '0 36px', textAlign: 'center',
        }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: '0.1em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase' }}>
            special project · 2025
          </div>
          <h1 style={{ fontFamily: "'Self Modern', serif", fontWeight: 400, fontSize: 'clamp(28px, 4vw, 56px)', color: '#fff', lineHeight: 1.2, maxWidth: 700 }}>
            Design System Generator
          </h1>
        </div>
      </div>

      <main style={{ flex: 1, padding: '80px 36px', maxWidth: 800, margin: '0 auto', width: '100%' }}>
        <div style={{ marginBottom: 48 }}>
          <div style={label}>Overview</div>
          <h2 style={heading}>About this project</h2>
          <p style={body}>Content coming soon. This case study will cover the Design System Generator project.</p>
        </div>
        <div style={{ marginBottom: 48 }}>
          <div style={label}>Problem</div>
          <h2 style={heading}>The challenge</h2>
          <p style={body}>Placeholder for problem statement.</p>
        </div>
        <div style={{ marginBottom: 64 }}>
          <div style={label}>Solution</div>
          <h2 style={heading}>What I designed</h2>
          <p style={body}>Placeholder for solution details.</p>
        </div>
        <a href="../index.html" style={{
          display: 'inline-flex', alignItems: 'center', gap: 8,
          fontFamily: 'Switzer, sans-serif', fontWeight: 500, fontSize: 14,
          color: '#1C1C22', textDecoration: 'none', borderBottom: '1px solid #1C1C22', paddingBottom: 2,
        }}>← Back to all work</a>
      </main>

      <EWFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DesignSystemPage />);
</script>
</body>
</html>
