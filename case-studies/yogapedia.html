<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Yogapedia — Sophia Alfred</title>
  <link rel="icon" href="../assets/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    @font-face {
      font-family: 'Self Modern';
      src: url('../assets/fonts/Self_Modern_Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #FFFBF4; color: #1C1C22; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #FFFBF4; }
    ::-webkit-scrollbar-thumb { background: #A8A8B3; border-radius: 3px; }

    /* Side nav */
    .sidenav {
      position: sticky; top: 56px;
      width: 199px; min-width: 199px;
      height: calc(100vh - 56px);
      padding: 18px;
      background: #FFFBF4;
      border-right: 1px solid rgba(0,0,0,0.06);
      display: flex; flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0; align-self: flex-start;
    }
    .sidenav-top { display: flex; flex-direction: column; gap: 12px; }
    .sidenav-link {
      font-family: 'IBM Plex Mono', monospace; font-weight: 400;
      font-size: 11px; letter-spacing: 0.06em; line-height: 165%;
      text-transform: uppercase; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      color: #CCCCCC; transition: color 0.15s ease;
    }
    .sidenav-link.active { color: #5A5A65; }
    .sidenav-link:hover { color: #5A5A65; }
    .sidenav-link.home { color: #5A5A65; margin-bottom: 10px; }
    .sidenav-link svg { flex-shrink: 0; }

    .content-pad { padding: 0 clamp(40px, 7vw, 120px); }

    @media (max-width: 768px) {
      .sidenav { display: none; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function EWNav({ activePage = 'work' }) {
  const [scrolled, setScrolled] = React.useState(false);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <nav style={{
      width: '100%', height: 56,
      background: scrolled ? 'rgba(255,251,244,0.92)' : 'rgba(255,251,244,0.001)',
      backdropFilter: 'blur(14px)', WebkitBackdropFilter: 'blur(14px)',
      borderBottom: '1px solid rgba(28,28,34,0.07)',
      display: 'flex', alignItems: 'center',
      justifyContent: 'space-between', padding: '0 24px',
      position: 'fixed', top: 0, zIndex: 100, boxSizing: 'border-box',
      transition: 'background 0.35s ease',
    }}>
      <a href="../index.html" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
        <img src="../assets/sophia-logo.png" alt="sophia alfred" style={{ height: 28, display: 'block' }} />
      </a>
      <div style={{ display: 'flex', gap: 24 }}>
        {[
          ['work',   'Work',   '../index.html#case-studies'],
          ['about',  'About',  '../about.html'],
          ['resume', 'Resume', '../assets/sophia-resume.pdf'],
        ].map(([id, label, href]) =>
          <a key={id} href={href}
            target={id === 'resume' ? '_blank' : undefined}
            rel={id === 'resume' ? 'noopener noreferrer' : undefined}
            style={{
              fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 14,
              letterSpacing: '0.01em', textDecoration: 'none',
              color: activePage === id ? '#1C1C22' : '#7A7A85', transition: 'color 0.2s',
            }}
            onMouseEnter={e => e.target.style.color = '#1C1C22'}
            onMouseLeave={e => e.target.style.color = activePage === id ? '#1C1C22' : '#7A7A85'}>
            {label}
          </a>
        )}
      </div>
    </nav>
  );
}

function EWFooter() {
  return (
    <footer style={{ background: '#1C1C23', boxShadow: '0px 4px 4px rgba(0,0,0,0.25)' }}>
      <div style={{
        borderTop: '1px solid rgba(255,255,255,0.08)', padding: '40px 36px',
        display: 'flex', justifyContent: 'space-between',
        alignItems: 'flex-start', flexWrap: 'wrap', gap: 24
      }}>
        <img src="../assets/sophia-logo-white.png" alt="sophia alfred"
          style={{ height: 32, display: 'block', opacity: 0.9 }} />
        <div style={{ display: 'flex', gap: 48 }}>
          {[
            { heading: 'say hi', links: [
              { label: 'LinkedIn', href: 'https://www.linkedin.com/in/sophia-alfred-sca07/' },
              { label: 'Email',    href: 'mailto:sophiacalfred@gmail.com' },
              { label: 'Resume',   href: '../assets/sophia-resume.pdf', external: true },
            ]},
            { heading: 'work', links: [
              { label: 'The Living Record', href: 'living-record.html' },
              { label: 'Garden Tours',      href: 'garden-tours.html' },
              { label: 'My Art Gallery',    href: '../about.html#gallery' },
            ]},
          ].map(col =>
            <div key={col.heading} style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{
                fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 11,
                color: 'rgba(255,255,255,0.5)', letterSpacing: '0.08em',
                textTransform: 'lowercase', marginBottom: 2,
              }}>{col.heading}</div>
              {col.links.map(l =>
                <a key={l.label} href={l.href}
                  target={l.external ? '_blank' : undefined}
                  rel={l.external ? 'noopener noreferrer' : undefined}
                  style={{
                    fontFamily: 'Manrope, sans-serif', fontSize: 13,
                    color: 'rgba(255,255,255,0.35)', letterSpacing: '0.01em',
                    textDecoration: 'none', transition: 'color 0.2s'
                  }}
                  onMouseEnter={e => e.target.style.color = 'rgba(255,255,255,0.85)'}
                  onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.35)'}>
                  {l.label}
                </a>
              )}
            </div>
          )}
        </div>
      </div>
      <div style={{
        padding: '0 36px 24px', fontFamily: 'Manrope, sans-serif',
        letterSpacing: '0.02em',
      }}>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.35)', marginBottom: 4 }}>Portfolio created with Claude Code :)</div>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.2)' }}>© 2026 Sophia Alfred</div>
      </div>
    </footer>
  );
}

const SECTION_IDS = ['overview', 'research', 'insights', 'ia', 'visual-design', 'final-designs', 'impact'];
const NAV_LINKS = [
  { id: 'overview',      label: 'Overview' },
  { id: 'research',      label: 'Research' },
  { id: 'insights',      label: 'Insights' },
  { id: 'ia',            label: 'Info Architecture' },
  { id: 'visual-design', label: 'Visual Design' },
  { id: 'final-designs', label: 'Final Designs' },
  { id: 'impact',        label: 'Impact' },
];

const ArrowLeft = () => (
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
    <path d="M7.5 2L3.5 6L7.5 10" stroke="#5A5A65" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const ArrowUp = () => (
  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style={{ transform: 'rotate(90deg)' }}>
    <path d="M7.5 2L3.5 6L7.5 10" stroke="#5A5A65" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

function SideNav() {
  const [active, setActive] = React.useState('overview');

  React.useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { rootMargin: '-56px 0px -70% 0px', threshold: 0 });

    SECTION_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return (
    <aside className="sidenav">
      <div className="sidenav-top">
        <a href="../index.html" className="sidenav-link home">
          <ArrowLeft /> HOME
        </a>
        {NAV_LINKS.map(({ id, label }) => (
          <a key={id} href={`#${id}`}
            className={`sidenav-link${active === id ? ' active' : ''}`}>
            {label}
          </a>
        ))}
      </div>
      <a href="#overview"
        className="sidenav-link home"
        onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
        <ArrowUp /> BACK TO TOP
      </a>
    </aside>
  );
}

const mono = { fontFamily: "'IBM Plex Mono', monospace" };

const sectionLabel = {
  ...mono, fontSize: 11, fontWeight: 500, letterSpacing: '0.1em',
  textTransform: 'uppercase', color: '#ED5632', marginBottom: 8,
};

const sectionHeading = {
  fontFamily: 'Manrope, sans-serif', fontWeight: 500,
  fontSize: 'clamp(16px, 1.6vw, 20px)', lineHeight: 1.35,
  color: '#1C1C22', marginBottom: 8,
};

const bodyText = {
  fontFamily: 'Manrope, sans-serif', fontWeight: 400,
  fontSize: 14, lineHeight: '21px', color: '#7A7A85',
};

function YogapediaPage() {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: '#FFFBF4' }}>
      <EWNav activePage="work" />

      {/* COVER */}
      <div style={{ width: '100%', aspectRatio: '16/7', background: '#F2E08A', position: 'relative', overflow: 'hidden' }}>
        <img src="../assets/yogapedia/yogapedia-cover.png" alt="Yogapedia"
          style={{ width: '100%', height: '100%', objectFit: 'cover', position: 'absolute', inset: 0 }} />
      </div>

      {/* PAGE LAYOUT */}
      <div style={{ display: 'flex', flex: 1 }}>
        <SideNav />

        <main style={{ flex: 1, minWidth: 0 }}>

          {/* ── OVERVIEW ── */}
          <section id="overview" style={{ paddingTop: 48 }}>
            <div className="content-pad">
              <div style={{ ...mono, fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#A8A8B3', marginBottom: 8 }}>
                Information Architecture · Fall 2025
              </div>
              <h2 style={{ fontFamily: "'Self Modern', serif", fontWeight: 400, fontSize: 'clamp(24px, 3.5vw, 44px)', color: '#1C1C22', lineHeight: 1.1, marginBottom: 24 }}>
                Yogapedia
              </h2>

              {/* Meta strip */}
              <div style={{
                display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16,
                borderTop: '1px solid rgba(28,28,34,0.1)', paddingTop: 16, marginBottom: 16,
              }}>
                {[
                  { label: 'Timeline', value: 'Sep 2025 – Dec 2025' },
                  { label: 'Role',     value: 'UX Designer' },
                  { label: 'Focus',    value: 'Information\nArchitecture\nContent Strategy' },
                  { label: 'Tools',    value: 'Figma\nOptimal Workshop\nMiro' },
                ].map(({ label, value }) => (
                  <div key={label}>
                    <div style={{ ...mono, fontSize: 10, fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#ED5632', marginBottom: 6 }}>{label}</div>
                    <div style={{ fontFamily: 'Manrope, sans-serif', fontSize: 13, color: '#5A5A65', lineHeight: 1.65, whiteSpace: 'pre-line' }}>{value}</div>
                  </div>
                ))}
              </div>

              <div style={sectionLabel}>Overview</div>
              <h3 style={{ fontFamily: 'Manrope, sans-serif', fontWeight: 400, fontSize: 'clamp(15px, 1.5vw, 18px)', lineHeight: 1.55, color: '#1C1C22', marginBottom: 8 }}>
                How do you organise thousands of yoga poses, sequences, and teaching resources so that beginners and advanced practitioners can both find what they need?
              </h3>
              <p style={{ ...bodyText, marginBottom: 24 }}>
                Yogapedia is a knowledge hub for the yoga community — covering poses, sequences, breathwork, and teaching resources. The existing structure had grown organically and was difficult to navigate. This project focused on restructuring the information architecture through user research, card sorting, and tree testing to create a system that works for practitioners at every level.
              </p>
              <a href="#final-designs" style={{
                display: 'inline-flex', alignItems: 'center', gap: 10,
                background: 'rgba(237,86,50,0.12)', borderRadius: 5,
                padding: '10px 18px', textDecoration: 'none',
              }}>
                <span style={{ ...mono, fontSize: 11, fontWeight: 500, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#ED5632' }}>Jump to Final Designs</span>
                <span style={{ color: '#ED5632', fontSize: 14, lineHeight: 1 }}>↓</span>
              </a>
            </div>
          </section>

          {/* ── RESEARCH ── */}
          <section id="research" style={{ paddingTop: 48 }}>
            <div className="content-pad">
              <div style={sectionLabel}>Research</div>
              <h3 style={sectionHeading}>Understanding how people find yoga content</h3>
              <p style={{ ...bodyText, marginBottom: 8 }}>
                I conducted user interviews with practitioners ranging from complete beginners to experienced teachers to understand their mental models for navigating yoga content. Three primary user types emerged.
              </p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24, marginTop: 20 }}>
                {[
                  { title: 'The Beginner',   sub: 'Needs guided paths and clear entry points', },
                  { title: 'The Practitioner', sub: 'Searches by pose name, body part, or goal', },
                  { title: 'The Teacher',    sub: 'Builds and saves sequences, references anatomy', },
                ].map(({ title, sub }) => (
                  <div key={title} style={{ background: '#FFFFFF', borderRadius: 4, overflow: 'hidden', border: '1px solid #DAD7D7', padding: '20px' }}>
                    <div style={{ fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 15, color: '#1C1C22', marginBottom: 6 }}>{title}</div>
                    <div style={{ fontFamily: 'Manrope, sans-serif', fontSize: 12, color: '#7A7A85', lineHeight: '18px' }}>{sub}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── INSIGHTS ── */}
          <section id="insights" style={{ paddingTop: 48 }}>
            <div className="content-pad">
              <div style={sectionLabel}>Insights</div>
              <h3 style={sectionHeading}>What the research revealed</h3>
              <p style={{ ...bodyText, marginBottom: 20 }}>
                The current navigation forced users into a single taxonomy that didn't match any of the three mental models. Beginners got lost in technical terminology, while experienced users couldn't filter by what mattered to them.
              </p>
              <div style={{ background: '#EEEDF0', borderRadius: 4, padding: '24px 28px' }}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#7A7A85', marginBottom: 16 }}>Design Principles</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {[
                    'Support multiple entry points — by goal, body area, and pose name',
                    'Surface progressive complexity rather than forcing it upfront',
                    'Make sequences a first-class object, not an afterthought',
                    'Teacher tools need a distinct space from practitioner content',
                  ].map((insight, i) => (
                    <div key={i} style={{ display: 'flex', gap: 16, alignItems: 'baseline' }}>
                      <span style={{ ...mono, fontSize: 11, color: '#ED5632', minWidth: 20 }}>0{i + 1}</span>
                      <span style={{ fontFamily: 'Manrope, sans-serif', fontSize: 14, color: '#5A5A65', lineHeight: '21px' }}>{insight}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* ── INFORMATION ARCHITECTURE ── */}
          <section id="ia" style={{ paddingTop: 48 }}>
            <div className="content-pad">
              <div style={sectionLabel}>Information Architecture</div>
              <h3 style={sectionHeading}>Card sorting and tree testing</h3>
              <p style={{ ...bodyText, marginBottom: 20 }}>
                I ran an open card sort with 24 participants to uncover natural groupings, followed by a closed card sort to validate the proposed structure. Tree testing confirmed that the new hierarchy significantly reduced time-on-task and error rates across all three user types.
              </p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
                {[
                  { label: 'Poses',      sub: 'Browse by name, body part, or difficulty' },
                  { label: 'Sequences',  sub: 'Curated flows and custom sequence builder' },
                  { label: 'Learn',      sub: 'Breathwork, philosophy, and anatomy' },
                  { label: 'Teach',      sub: 'Resources, class plans, and CPD content' },
                ].map(({ label, sub }) => (
                  <div key={label} style={{ background: '#F2E08A', borderRadius: 4, padding: '20px 16px' }}>
                    <div style={{ fontFamily: 'Manrope, sans-serif', fontWeight: 600, fontSize: 15, color: '#1C1C22', marginBottom: 6 }}>{label}</div>
                    <div style={{ fontFamily: 'Manrope, sans-serif', fontSize: 12, color: '#5A5A65', lineHeight: '18px' }}>{sub}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── VISUAL DESIGN ── */}
          <section id="visual-design" style={{ paddingTop: 48 }}>
            <div className="content-pad">
              <div style={sectionLabel}>Visual Design</div>
              <h3 style={sectionHeading}>A calm, focused visual language</h3>
              <p style={{ ...bodyText, marginBottom: 8 }}>
                The visual design reflects the practice itself — calm, focused, and grounded. A warm neutral palette with generous whitespace keeps the content front and centre. Typography scales clearly to communicate hierarchy without hierarchy feeling rigid.
              </p>
            </div>
          </section>

          {/* ── FINAL DESIGNS ── */}
          <section id="final-designs" style={{ paddingTop: 48 }}>
            <div className="content-pad">
              <div style={sectionLabel}>Final Designs</div>
              <h3 style={sectionHeading}>Redesigned navigation and key screens</h3>
              <p style={{ ...bodyText, marginBottom: 16 }}>
                The final designs cover the global navigation, the pose library, sequence builder, and the teacher portal. Full designs coming soon.
              </p>
            </div>
          </section>

          {/* ── IMPACT ── */}
          <section id="impact" style={{ paddingTop: 48, paddingBottom: 64 }}>
            <div className="content-pad">
              <div style={sectionLabel}>Impact &amp; Next Steps</div>
              <h3 style={sectionHeading}>Outcomes and reflections</h3>
              <p style={{ ...bodyText, marginBottom: 32 }}>
                The restructured IA reduced findability errors by a significant margin in tree testing. The new structure also opened up opportunities for personalisation — recommending content based on what a user has previously saved or searched.
              </p>
              <h3 style={{ ...sectionHeading, marginBottom: 16 }}>Next steps</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 48 }}>
                {['Usability testing on the redesigned navigation', 'Explore personalisation and saved content features', 'Handoff to development with annotated specs'].map((step, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 20 }}>
                    <span style={{ ...mono, fontSize: 12, fontWeight: 500, color: '#ED5632', minWidth: 24 }}>0{i + 1}</span>
                    <span style={{ fontFamily: 'Manrope, sans-serif', fontSize: 15, color: '#5A5A65' }}>{step}</span>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
                <a href="../index.html" style={{
                  display: 'inline-flex', alignItems: 'center', gap: 8,
                  fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 14,
                  color: '#1C1C22', textDecoration: 'none', borderBottom: '1px solid #1C1C22', paddingBottom: 2,
                }}>← Back to all work</a>
                <a href="living-record.html" style={{
                  display: 'inline-flex', alignItems: 'center', gap: 8,
                  fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 14,
                  color: '#1C1C22', textDecoration: 'none', borderBottom: '1px solid #1C1C22', paddingBottom: 2,
                }}>Next: The Living Record →</a>
              </div>
            </div>
          </section>

        </main>
      </div>

      <EWFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<YogapediaPage />);
</script>
</body>
</html>
