/* ── DotGrid with bulge ── */
function DotGrid({ width, height, mouseX, mouseY }) {
  const canvasRef = React.useRef(null);
  const GAP = 16;
  const BASE_R = 0.8;
  const BULGE_RADIUS = 160;
  const BULGE_STRENGTH = 24;

  const displace = React.useCallback((x, y) => {
    if (mouseX === null || mouseY === null) return { x, y };
    const dx = x - mouseX;
    const dy = y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < BULGE_RADIUS && dist > 0) {
      const t = 1 - dist / BULGE_RADIUS;
      const ease = t * t;
      const push = ease * BULGE_STRENGTH;
      return { x: x + (dx / dist) * push, y: y + (dy / dist) * push };
    }
    return { x, y };
  }, [mouseX, mouseY]);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    ctx.strokeStyle = 'rgba(28,28,34,0.07)';
    ctx.lineWidth = 0.5;

    const OFFSET = 8;
    const cols = Math.ceil((width + OFFSET) / GAP) + 1;
    const rows = Math.ceil((height + OFFSET) / GAP) + 1;

    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      for (let r = 0; r <= rows; r++) {
        const p = displace(c * GAP + OFFSET, r * GAP + OFFSET);
        if (r === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    for (let r = 0; r <= rows; r++) {
      ctx.beginPath();
      for (let c = 0; c <= cols; c++) {
        const p = displace(c * GAP + OFFSET, r * GAP + OFFSET);
        if (c === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }, [width, height, mouseX, mouseY, displace]);

  return (
    <canvas ref={canvasRef} style={{
      position: 'absolute', inset: 0, width: '100%', height: '100%',
      pointerEvents: 'none',
    }} />
  );
}

          ))}

    </>

}

function GridHeroWrapper({ children }) {
  const wrapRef = React.useRef(null);
  const [dims, setDims] = React.useState({ w: 0, h: 0 });
  const [mouse, setMouse] = React.useState({ x: null, y: null });
  const raf = React.useRef(null);
  const pending = React.useRef(null);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const ro = new ResizeObserver(([entry]) => {
      setDims({ w: entry.contentRect.width, h: entry.contentRect.height });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const handlePointerMove = React.useCallback((e) => {
    const rect = wrapRef.current.getBoundingClientRect();
    pending.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    if (!raf.current) {
      raf.current = requestAnimationFrame(() => {
        setMouse(pending.current);
        raf.current = null;
      });
    }
  }, []);

  const handlePointerLeave = React.useCallback(() => {
    setMouse({ x: null, y: null });
  }, []);

  return (
    <div ref={wrapRef} onPointerMove={handlePointerMove} onPointerLeave={handlePointerLeave}
      style={{ position: 'relative', overflow: 'visible' }}>
      <div style={{ position: 'absolute', left: 0, right: 0, top: -56, bottom: 0, pointerEvents: 'none' }}>
        <DotGrid width={dims.w} height={dims.h + 56} mouseX={mouse.x} mouseY={mouse.y !== null ? mouse.y + 56 : null} />
      </div>
      {children}
    </div>
  );
}
