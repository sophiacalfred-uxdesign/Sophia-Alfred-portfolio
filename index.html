<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sophia Alfred — Portfolio</title>
  <link rel="icon" href="assets/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    @font-face {
      font-family: 'Self Modern';
      src: url('assets/fonts/Self_Modern_Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #FFFBF4; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #FFFBF4; }
    ::-webkit-scrollbar-thumb { background: #A8A8B3; border-radius: 3px; }
    .project-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 768px) { .project-grid { grid-template-columns: 1fr; } }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── Nav ── */
function EWNav({ activePage = 'work' }) {
  return (
    <nav style={{
      width: '100%', height: 56, background: '#FFFBF4',
      borderBottom: '1px solid rgba(28,28,34,0.07)',
      display: 'flex', alignItems: 'center',
      justifyContent: 'space-between', padding: '0 24px',
      position: 'sticky', top: 0, zIndex: 100, boxSizing: 'border-box'
    }}>
      <a href="index.html" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
        <img src="assets/sophia-logo.png" alt="sophia alfred" style={{ height: 28, display: 'block' }} />
      </a>
      <div style={{ display: 'flex', gap: 24 }}>
        {[
          ['work',   'Work', '#case-studies'],
          ['about',  'About',        'about.html'],
          ['resume', 'Resume',       'assets/sophia-resume.pdf'],
        ].map(([id, label, href]) =>
          <a key={id} href={href}
            target={id === 'resume' ? '_blank' : undefined}
            rel={id === 'resume' ? 'noopener noreferrer' : undefined}
            style={{
              fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 14,
              letterSpacing: '0.01em', textDecoration: 'none',
              color: activePage === id ? '#1C1C22' : '#7A7A85', transition: 'color 0.2s',
            }}
            onMouseEnter={e => e.target.style.color = '#1C1C22'}
            onMouseLeave={e => e.target.style.color = activePage === id ? '#1C1C22' : '#7A7A85'}>
            {label}
          </a>
        )}
      </div>
    </nav>
  );
}

/* ── Footer ── */
function EWFooter() {
  return (
    <footer style={{ background: '#1C1C23', boxShadow: '0px 4px 4px rgba(0,0,0,0.25)' }}>
      <div style={{
        borderTop: '1px solid rgba(255,255,255,0.08)',
        padding: '40px 36px', display: 'flex',
        justifyContent: 'space-between', alignItems: 'flex-start',
        flexWrap: 'wrap', gap: 24
      }}>
        <img src="assets/sophia-logo-white.png" alt="sophia alfred"
          style={{ height: 32, display: 'block', opacity: 0.9 }} />
        <div style={{ display: 'flex', gap: 48 }}>
          {[
            { heading: 'say hi', links: [
              { label: 'LinkedIn', href: 'https://www.linkedin.com/in/sophia-alfred-sca07/' },
              { label: 'Email',    href: 'mailto:sophiacalfred@gmail.com' },
              { label: 'Resume',   href: 'assets/sophia-resume.pdf', external: true },
            ]},
            { heading: 'work', links: [
              { label: 'The Living Record', href: 'case-studies/living-record.html' },
              { label: 'Garden Tours',      href: 'case-studies/garden-tours.html' },
              { label: 'Yogapedia',         href: 'case-studies/yogapedia.html' },
              { label: 'My Art Gallery', href: 'about.html#gallery' },
            ]},
          ].map(col =>
            <div key={col.heading} style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{
                fontFamily: 'Manrope, sans-serif', fontWeight: 500, fontSize: 11,
                color: 'rgba(255,255,255,0.5)', letterSpacing: '0.08em',
                textTransform: 'lowercase', marginBottom: 2,
              }}>{col.heading}</div>
              {col.links.map(l =>
                <a key={l.label} href={l.href}
                  target={l.external ? '_blank' : undefined}
                  rel={l.external ? 'noopener noreferrer' : undefined}
                  style={{
                    fontFamily: 'Manrope, sans-serif', fontSize: 13,
                    color: 'rgba(255,255,255,0.35)', letterSpacing: '0.01em',
                    textDecoration: 'none', transition: 'color 0.2s'
                  }}
                  onMouseEnter={e => e.target.style.color = 'rgba(255,255,255,0.85)'}
                  onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.35)'}>
                  {l.label}
                </a>
              )}
            </div>
          )}
        </div>
      </div>
      <div style={{
        padding: '0 36px 24px', fontFamily: 'Manrope, sans-serif',
        fontSize: 11, color: 'rgba(255,255,255,0.2)', letterSpacing: '0.02em',
      }}>© 2026 Sophia Alfred</div>
    </footer>
  );
}

/* ── ProjectCard ── */
function ProjectCard({ title, meta, description, image, video, bgColor, href, children, stretchMedia, cursorLabel, cursorBg, videoHeight }) {
  const [hovered, setHovered] = React.useState(false);
  const [mousePos, setMousePos] = React.useState({ x: 0, y: 0 });

  const handleMouseMove = (e) => {
    setMousePos({ x: e.clientX, y: e.clientY });
  };

  return (
    <div
      onClick={() => href && (window.location.href = href)}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      onMouseMove={cursorLabel ? handleMouseMove : undefined}
      style={{ display: 'flex', flexDirection: 'column', gap: 6, cursor: cursorLabel ? 'none' : (href ? 'pointer' : 'default'), position: 'relative' }}>

      {/* Custom cursor label */}
      {cursorLabel && hovered && (
        <div style={{
          position: 'fixed',
          left: mousePos.x + 14,
          top: mousePos.y - 10,
          background: cursorBg || '#016FEB',
          color: '#F4EFE4',
          fontFamily: 'Manrope, sans-serif',
          fontWeight: 500,
          fontSize: 12,
          letterSpacing: '0.04em',
          padding: '5px 10px',
          borderRadius: 400,
          pointerEvents: 'none',
          zIndex: 9999,
          whiteSpace: 'nowrap',
        }}>{cursorLabel}</div>
      )}
      <div style={{
        width: '100%',
        borderRadius: 2, overflow: 'hidden',
        background: bgColor || '#F0EEEA',
        transform: hovered ? 'scale(1.005)' : 'scale(1)',
        transition: 'transform 0.3s ease',
      }}>
        {video && <video src={video} autoPlay muted loop playsInline
          style={{ width: '100%', height: videoHeight ? videoHeight : 'auto', objectFit: videoHeight ? 'cover' : 'unset', display: 'block' }} />}
        {image && !video && <img src={image} alt={title}
          style={{ width: '100%', height: 'auto', display: 'block' }} />}
        {children}
      </div>
      {meta && <div style={{
        fontFamily: 'Manrope, sans-serif', fontWeight: 300, fontSize: 12,
        lineHeight: '18px', letterSpacing: '0.01em', color: '#7A7A85',
      }}>{meta}</div>}
      <div style={{
        fontFamily: "'Self Modern', serif", fontWeight: 300,
        fontSize: 20, lineHeight: '22px', letterSpacing: '0.01em',
        color: hovered ? '#A8A8B3' : '#5A5A65', transition: 'color 0.2s',
      }}>{title}</div>
      {description && <div style={{
        fontFamily: 'Manrope, sans-serif', fontWeight: 400, fontSize: 14,
        lineHeight: '17px', letterSpacing: '0.01em', color: '#7A7A85',
      }}>{description}</div>}
    </div>
  );
}

/* ── Hero ── */
function HeroSection() {
  const roles = ['Product Designer', 'Visual Storyteller', 'Information Architect', 'Cat Lover'];
  const [roleIndex, setRoleIndex] = React.useState(0);
  const [visible, setVisible] = React.useState(true);

  React.useEffect(() => {
    const interval = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setRoleIndex(i => (i + 1) % roles.length); setVisible(true); }, 400);
    }, 2400);
    return () => clearInterval(interval);
  }, []);

  return (
    <div style={{
      width: '100%', height: 'calc(100vh - 56px)', background: '#FFFBF4',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', padding: '0 36px', textAlign: 'center',
    }}>
      <h1 style={{
        fontFamily: "'Self Modern', serif", fontWeight: 400,
        fontSize: 'clamp(42px, 6vw, 72px)', lineHeight: 1.1, color: '#1C1C22',
        margin: 0, display: 'flex', flexDirection: 'column',
        alignItems: 'center', gap: 12,
      }}>
        <span>Hi! I'm Sophia a</span>
        <span style={{
          color: '#046EEB', display: 'inline-block',
          opacity: visible ? 1 : 0,
          transform: visible ? 'translateY(0)' : 'translateY(6px)',
          transition: 'opacity 0.35s ease, transform 0.35s ease',
        }}>{roles[roleIndex]}</span>
      </h1>
      <p style={{
        fontFamily: 'Manrope, sans-serif', fontWeight: 400, fontSize: 16,
        lineHeight: '24px', letterSpacing: '0.01em', color: '#7A7A85',
        marginTop: 28, maxWidth: 520,
      }}>Product Design Intern @Cloudflare</p>
    </div>
  );
}

/* ── Data ── */
const PROJECTS_LEFT = [
  {
    id: 'cloudflare',
    title: 'Cloudflare Product Design Internship',
    meta: 'Cloudflare Internship · Summer 2026',
    description: "IncomingProduct Design intern at Cloudflare. Case study coming later this summer!",
    video: 'assets/cloudflare-cover1.mov',
    bgColor: '#016FEB',
    cursorLabel: 'IN PROGRESS!',
     videoHeight: 'clamp(300px, 38vw, 700px)',
  },
  {
    id: 'garden-tours',
    title: 'Garden Tours',
    meta: 'Interaction Design · Fall 2025 · Case Study',
    description: 'Guided listening experiences for local London park.',
    video: 'assets/garden-tours-cover.mov',
    bgColor: '#B8BFEE',
    stretchMedia: true,
    href: 'case-studies/garden-tours.html',
    videoHeight: 'clamp(300px, 46vw, 980px)',
  },
  {
    id: 'memento',
    title: 'Memento',
    meta: 'Client project · Spring 2025',
    description: 'An AI note taking and memory keeping application.',
    image: 'assets/memento-cover.png',
    bgColor: '#D4CDFF',
    cursorLabel: 'CASE STUDY UNDER CONSTRUCTION!',
    cursorBg: '#ED5632',
  },
];

const PROJECTS_RIGHT = [
  {
    id: 'living-record',
    title: 'The Living Record: Museum Exhibit',
    meta: 'London Natural History Museum · Client Project · Spring 2026 · Case Study',
    description: 'Exhibition design for the Urban Nature Project.',
    video: 'assets/living-record-cover.mov',
    bgColor: '#C8D9A0',
    href: 'case-studies/living-record.html',
  },
  {
    id: 'yogapedia',
    title: 'Yogapedia',
    meta: 'Information Architecture · Fall 2025 · Case Study',
    description: 'A yoga knowledge hub for poses, sequences, and teaching.',
    image: 'assets/yogapedia-cover.png',
    bgColor: '#F2E08A',
    cursorLabel: 'CASE STUDY UNDER CONSTRUCTION!',
    cursorBg: '#ED5632',
  },
  {
    id: 'design-system',
    title: 'Design System Generator',
    meta: 'Personal project · Winter 2026',
    description: 'AI powered Design System Generator that creates a functional design foundation from text prompts.',
    video: 'assets/design-system-cover.mp4',
    bgColor: '#1C1C22',
    cursorLabel: 'CASE STUDY UNDER CONSTRUCTION!',
    cursorBg: '#ED5632',
  },
];

/* ── App ── */
function App() {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: '#FFFBF4' }}>
      <EWNav activePage="work" />
      <div style={{ flex: 1 }}>
        <HeroSection />
        <div id="case-studies" style={{ padding: '0 36px 80px', maxWidth: 1700, margin: '0 auto' }}>
          <div className="project-grid">
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              {PROJECTS_LEFT.map(p => <ProjectCard key={p.id} {...p} />)}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              {PROJECTS_RIGHT.map(p => <ProjectCard key={p.id} {...p} />)}
            </div>
          </div>
        </div>
      </div>
      <EWFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
