    html, body { height: 100%; }
    body {
      background: #FCFDFE; -webkit-font-smoothing: antialiased;

    ::-moz-selection { background: rgba(4,110,235,0.04); color: #046EEB; }

    ::-webkit-scrollbar-track { background: #FCFDFE; }
    ::-webkit-scrollbar-thumb { background: #A8A8B3; border-radius: 3px; }

      0% { opacity: 0; transform: translateX(-50%) translateY(4px) scale(0.95); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

      font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 6px; white-space: nowrap;
      animation: toastPop 1.5s ease forwards;
      pointer-events: none;

      .projects-heading { margin-top: 32px; }
      .nav-links { display: none !important; }
      .hamburger-btn { display: flex !important; }

      to { opacity: 1; }

      40% { transform: rotate(8deg); }
      60% { transform: rotate(-5deg); }
      80% { transform: rotate(5deg); }

    .blurb-text.blurb-active .sparkle-icon {
      color: #046EEB;
      animation: sparkleShake 0.5s ease;
    }
    .blurb-highlight {
      background: linear-gradient(to right, rgba(4, 110, 235, 0.08) 100%, transparent 0);
      background-size: 0% 100%;
      background-repeat: no-repeat;
      background-position: left;
      transition: background-size 0.6s ease, color 0.6s ease;
      border-radius: 2px;
    }
    .blurb-text:hover .blurb-highlight,
    .blurb-text.blurb-active .blurb-highlight {
      background-size: 100% 100%;
      color: #046EEB;
    }

    }

/* ── ProjectCard ── */
function ProjectCard({ title, meta, description, image, video, bgColor, href, onClick, children, stretchMedia, cursorLabel, cursorBg, videoHeight, thumbHeight, aspectRatio, flexGrow, fillRow }) {
  const [hovered, setHovered] = React.useState(false);
  const [mousePos, setMousePos] = React.useState({ x: 0, y: 0 });

  const handleMouseMove = (e) => {
    setMousePos({ x: e.clientX, y: e.clientY });
  };

  const handleClick = () => {
    if (onClick) { onClick(); }
    else if (href) { window.location.href = href; }
  };

  return (
    <div
      onClick={handleClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      onMouseMove={cursorLabel ? handleMouseMove : undefined}
      style={{ display: 'flex', flexDirection: 'column', gap: 16, cursor: cursorLabel ? 'none' : (href || onClick ? 'pointer' : 'default'), position: 'relative', flex: flexGrow ? 1 : undefined, height: fillRow ? '100%' : undefined }}>

      {/* Custom cursor label */}
      {cursorLabel && hovered && (
        <div style={{
          position: 'fixed',
          left: mousePos.x + 14,
          top: mousePos.y - 10,
          background: cursorBg || '#016FEB',
          color: '#F4EFE4',
          fontFamily: 'Switzer, sans-serif',
          fontWeight: 500,
          fontSize: 12,
          letterSpacing: '0.04em',
          padding: '5px 10px',
          borderRadius: 400,
          pointerEvents: 'none',
          zIndex: 9999,
          whiteSpace: 'nowrap',
        }}>{cursorLabel}</div>
      )}
      {/* Thumbnail with hover overlay */}
      <div style={{
        width: '100%',
        borderRadius: 0, overflow: 'hidden',
        background: bgColor || '#F0EEEA',
        transform: hovered ? 'scale(1.01)' : 'scale(1)',
        transition: 'transform 0.3s ease',
        position: 'relative',
        flex: (flexGrow || fillRow) ? 1 : undefined,
        minHeight: (flexGrow || fillRow) ? 200 : undefined,
        height: thumbHeight || undefined,
        aspectRatio: (!thumbHeight && !flexGrow && !fillRow && aspectRatio) ? aspectRatio : undefined,
      }}>
        {video && <video src={video} autoPlay muted loop playsInline
          style={{ width: '100%', height: (flexGrow || fillRow || videoHeight || thumbHeight || aspectRatio) ? '100%' : 'auto', objectFit: (flexGrow || fillRow || videoHeight || thumbHeight || aspectRatio) ? 'cover' : 'unset', display: 'block', position: fillRow ? 'absolute' : undefined, inset: fillRow ? 0 : undefined }} />}
        {image && !video && <img src={image} alt={title}
          style={{ width: '100%', height: (flexGrow || fillRow || thumbHeight || aspectRatio) ? '100%' : 'auto', objectFit: (flexGrow || fillRow || thumbHeight || aspectRatio) ? 'cover' : undefined, display: 'block', position: (flexGrow || fillRow) ? 'absolute' : undefined, inset: (flexGrow || fillRow) ? 0 : undefined }} />}
        {children}
        {/* Gradient overlay + meta on hover */}
        {meta && <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0,
          background: 'linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.2) 35%, rgba(0,0,0,0.08) 60%, rgba(0,0,0,0) 100%)',
          padding: '120px 20px 20px',
          opacity: hovered ? 1 : 0,
          transition: 'opacity 0.3s ease',
          pointerEvents: 'none',
        }}>
          <div style={{
            fontFamily: 'Switzer, sans-serif', fontWeight: 400, fontSize: 16,
            lineHeight: '22px', letterSpacing: '0.01em', color: '#FFFFFF',
          }}>{meta}</div>
        </div>}
      </div>
      {/* Title + description group */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        <div style={{
          fontFamily: 'Switzer, sans-serif', fontWeight: hovered ? 400 : 300,

        }}>{description}</div>}
      </div>
    </div>
  );
}

/* ── DotGrid with bulge ── */
function DotGrid({ width, height, mouseX, mouseY }) {
  const canvasRef = React.useRef(null);
  const GAP = 16;
  const BASE_R = 0.8;
  const BULGE_RADIUS = 160;
  const BULGE_STRENGTH = 24;

  const displace = React.useCallback((x, y) => {
    if (mouseX === null || mouseY === null) return { x, y };
    const dx = x - mouseX;
    const dy = y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < BULGE_RADIUS && dist > 0) {
      const t = 1 - dist / BULGE_RADIUS;
      const ease = t * t;
      const push = ease * BULGE_STRENGTH;
      return { x: x + (dx / dist) * push, y: y + (dy / dist) * push };
    }
    return { x, y };
  }, [mouseX, mouseY]);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    ctx.strokeStyle = 'rgba(28,28,34,0.07)';
    ctx.lineWidth = 0.5;

    const OFFSET = 8;
    const cols = Math.ceil((width + OFFSET) / GAP) + 1;
    const rows = Math.ceil((height + OFFSET) / GAP) + 1;

    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      for (let r = 0; r <= rows; r++) {
        const p = displace(c * GAP + OFFSET, r * GAP + OFFSET);
        if (r === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    for (let r = 0; r <= rows; r++) {
      ctx.beginPath();
      for (let c = 0; c <= cols; c++) {
        const p = displace(c * GAP + OFFSET, r * GAP + OFFSET);
        if (c === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }, [width, height, mouseX, mouseY, displace]);

  return (
    <canvas ref={canvasRef} style={{
      position: 'absolute', inset: 0, width: '100%', height: '100%',
      pointerEvents: 'none',
    }} />
  );
}

  const [visible, setVisible] = React.useState(true);

      setVisible(false);

    return () => clearInterval(interval);
  }, []);

  return (
    <div style={{

      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '0 36px', textAlign: 'center',

        margin: 0, display: 'flex', flexDirection: 'column',

          color: '#046EEB', display: 'inline-block',

}

/* ── Nav + Hero wrapper with grid ── */
function NavHeroWrapper({ children }) {
  const wrapRef = React.useRef(null);
  const [dims, setDims] = React.useState({ w: 0, h: 0 });
  const [mouse, setMouse] = React.useState({ x: null, y: null });
  const [atWork, setAtWork] = React.useState(false);
  const raf = React.useRef(null);
  const pending = React.useRef(null);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const ro = new ResizeObserver(([entry]) => {
      setDims({ w: entry.contentRect.width, h: entry.contentRect.height });
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  React.useEffect(() => {
    const onScroll = () => {
      const section = document.getElementById('case-studies');
      if (!section) return;
      const rect = section.getBoundingClientRect();
      setAtWork(rect.top < window.innerHeight * 0.6 && rect.bottom > 56);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const handlePointerMove = React.useCallback((e) => {
    const rect = wrapRef.current.getBoundingClientRect();
    pending.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    if (!raf.current) {
      raf.current = requestAnimationFrame(() => {
        setMouse(pending.current);
        raf.current = null;
      });
    }
  }, []);

  const handlePointerLeave = React.useCallback(() => {
    setMouse({ x: null, y: null });
  }, []);

  return (
    <>
      <EWNav activePage={atWork ? 'work' : null} />
      <div ref={wrapRef} onPointerMove={handlePointerMove} onPointerLeave={handlePointerLeave}
        style={{ position: 'relative', overflow: 'visible' }}>
        <div style={{ position: 'absolute', left: 0, right: 0, top: -56, bottom: 0, pointerEvents: 'none' }}>
          <DotGrid width={dims.w} height={dims.h + 56} mouseX={mouse.x} mouseY={mouse.y !== null ? mouse.y + 56 : null} />
        </div>
        <HeroSection />
        {children}
      </div>
    </>
  );
}

/* ── Work-in-progress modal (Pay Per Use case study) ── */
function WipModal({ onClose }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;
    };
  }, [onClose]);

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, zIndex: 10000,
        background: 'rgba(16,16,20,0.55)', backdropFilter: 'blur(4px)',

            border: 'none', borderRadius: 8, background: 'transparent',
            color: '#6E6E78', cursor: 'pointer', transition: 'background 0.15s ease',
