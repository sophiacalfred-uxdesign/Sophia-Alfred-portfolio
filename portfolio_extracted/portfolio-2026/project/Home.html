function HeroSection() {
  const roles = [
  'Product Designer',
  'Visual Storyteller',
  'Product Designer'];

  const [roleIndex, setRoleIndex] = React.useState(0);
  const [visible, setVisible] = React.useState(true);

  React.useEffect(() => {
    const interval = setInterval(() => {
      setVisible(false);
      setTimeout(() => {
        setRoleIndex((i) => (i + 1) % roles.length);
        setVisible(true);
      }, 350);
    }, 2600);
    return () => clearInterval(interval);
  }, []);

  return (
    <div style={{
      width: '100%',
      height: 'calc(100vh - 56px)',
      background: '#F4EFE4',
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      padding: '0 36px',
      textAlign: 'center'
    }}>
      <h1 style={{
        fontFamily: "'Self Modern', serif",
        fontWeight: 400,
        fontSize: 'clamp(28px, 5vw, 72px)',
        lineHeight: 1.15,
        color: '#1C1C22',
        margin: 0,
        marginBottom: 4
      }}>
        Hi! I'm Sophia a
      </h1>
      <h1 style={{
        fontFamily: "'Self Modern', serif",
        fontWeight: 400,
        fontSize: 'clamp(28px, 5vw, 72px)',
        lineHeight: 1.15,
        color: '#046EEB',

        marginBottom: 28,
        opacity: visible ? 1 : 0,
        transform: visible ? 'translateY(0)' : 'translateY(8px)',
        transition: 'opacity 0.3s ease, transform 0.3s ease', margin: "10px 0px 28px"
      }}>
        {roles[roleIndex]}
      </h1>
      <p style={{

        fontWeight: 400,

        lineHeight: '1.6',
        letterSpacing: '0.01em',
        color: '#7A7A85', fontFamily: "Manrope", fontSize: "14px"
      }}>
        Product Design Intern @Cloudflare
      </p>
    </div>);

}
